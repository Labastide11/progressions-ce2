<script id="dictation-visible-in-edt-v3692">
/* V36.94 — Afficher la dictée réelle directement dans la séance du matin.
   Source unique : DICTEES_CE2. Aucun texte de dictée n'est dupliqué ici. */
(function(){
  'use strict';

  function clean(s){
    return String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function words(v){
    return Array.isArray(v) ? v.join(' · ') : String(v || '').trim();
  }

  function flashes(plan){
    if(!plan) return [];
    var src = Array.isArray(plan.flashes) ? plan.flashes :
              (Array.isArray(plan.flash) ? plan.flash : []);
    return src.map(function(item){
      return Array.isArray(item) ? item[item.length - 1] : item;
    }).filter(Boolean);
  }

  function frenchDate(label){
    var months={
      janvier:0,fevrier:1,février:1,mars:2,avril:3,mai:4,juin:5,
      juillet:6,aout:7,août:7,septembre:8,octobre:9,novembre:10,
      decembre:11,décembre:11
    };
    var s=clean(label).replace(/\b1er\b/g,'1');
    var m=s.match(/(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
    if(!m || months[m[2]]===undefined) return null;
    return new Date(Number(m[3]),months[m[2]],Number(m[1]),12,0,0);
  }

  function dictation(plan, date){
    if(!plan || !date) return null;
    var day=date.getDay(), fs=flashes(plan), label='Dictée du jour', value='';

    if(day===1){
      label='Dictée de mots';
      value=words(plan.priority || plan.words);
      if(/^pas de banque/i.test(value)) value=String(plan.note || '');
    } else if(day===2){
      value=fs[0] || plan.final || words(plan.words);
    } else if(day===4){
      value=fs[1] || fs[0] || plan.final || words(plan.words);
    } else if(day===5){
      value=fs[2] || fs[1] || fs[0] || plan.final || words(plan.words);
      if(plan.final && value !== plan.final){
        value += '<br><strong>⭐ Dictée bilan :</strong> ' + plan.final;
      }
    }

    if(!value) return null;
    return {
      label: label,
      theme: String(plan.theme || plan.support || ''),
      value: value
    };
  }

  function stripGeneric(text){
    return String(text || '')
      .replace(/(?:<br>\s*)?✍️\s*(?:<strong>)?Dictée du jour(?:<\/strong>)?\s*:\s*écrire la dictée(?:,\s*puis faire la correction juste en dessous\.?)?/gi,'')
      .replace(/(?:<br>\s*)?✅\s*(?:<strong>)?Correction(?:<\/strong>)?\s*:\s*corriger juste en dessous\.?/gi,'')
      .replace(/\s{2,}/g,' ')
      .trim();
  }

  function enrich(){
    var data=window.PROGRESSIONS_EDT_DATA || {};
    var bank=window.DICTEES_CE2 || {};
    var weeks=data.p1DetailedWeeks;
    if(!Array.isArray(weeks) || !bank.p1) return;

    weeks.forEach(function(week, wi){
      if(!week || !Array.isArray(week.days)) return;
      var plan=bank.p1[wi + 1];
      if(!plan) return;

      week.days.forEach(function(dayEntry){
        if(!Array.isArray(dayEntry) || !Array.isArray(dayEntry[1])) return;
        var date=frenchDate(dayEntry[0]);
        var d=dictation(plan,date);
        if(!d) return;

        var row=dayEntry[1].find(function(r){
          return Array.isArray(r) && /^9h/.test(String(r[0]||'')) &&
                 !/évaluation nationale/i.test(String(r[1]||'')+' '+String(r[2]||''));
        });
        if(!row) return;

        var base=stripGeneric(row[2]);
        var theme=d.theme ? ' — ' + d.theme : '';
        var block =
          '<br><br>✍️ <strong>' + d.label + theme + '</strong>' +
          '<br><span class="dictation-exact">' + d.value + '</span>' +
          '<br>✅ <strong>Correction :</strong> juste en dessous dans le cahier du jour.';

        if(clean(base).indexOf(clean(d.value.replace(/<[^>]+>/g,' ')))===-1){
          row[2]=base + block;
        }
      });
    });
  }

  enrich();
})();
</script>

<script>
/* V36.47 — démarrage de la vraie page emploi du temps selon l'URL. */
(function(){
  'use strict';

  function start(){
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode') || 'period';
    var period = (params.get('period') || 'p1').toLowerCase();

    window.setTimeout(function(){
      if (mode === 'day') {
        var dayBtn = document.getElementById('openTimetableDetailBtn');
        if (dayBtn) dayBtn.click();
        return;
      }

      if (mode === 'summary') {
        var summaryBtn = document.getElementById('openTimetableSummaryBtn');
        if (summaryBtn) summaryBtn.click();
        return;
      }

      var periodBtn = document.querySelector('[data-open-summary-period="' + period + '"]');
      if (!periodBtn) periodBtn = document.querySelector('[data-open-summary-period="p1"]');
      if (periodBtn) periodBtn.click();
    }, 120);
  }

  document.addEventListener('click', function(e){
    var close = e.target.closest('#closeTimetableBtn');
    if (close) {
      e.preventDefault();
      e.stopImmediatePropagation();
      window.location.href = 'index.html';
    }
  }, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

<script id="edt-inline-session-v3694">
/* V36.94 — Séance complète dans la page.
   Correction V36.94 : on ne bloque plus le gestionnaire d'origine.
   Celui-ci calcule normalement l'URL ; window.open est intercepté uniquement
   pendant le clic sur "Ouvrir la séance complète". */
(function(){
  'use strict';

  var sessionClickButton = null;
  var nativeOpen = window.open;

  function label(el){
    return String(el && el.textContent || '').replace(/\s+/g,' ').trim();
  }

  function isSessionControl(el){
    return !!el && /ouvrir la séance complète|masquer la séance complète/i.test(label(el));
  }

  function closestSessionControl(target){
    if(!target || !target.closest) return null;
    var direct = target.closest('a,button,[role="button"]');
    if(direct && isSessionControl(direct)) return direct;

    var node = target.closest('*');
    while(node && node !== document.body){
      if(isSessionControl(node)) return node;
      node = node.parentElement;
    }
    return null;
  }

  function hostFor(btn){
    return btn.closest(
      '.timetable-session, .timetable-detail, .session-card, .lesson-card, ' +
      '.timetable-row, .detail-card, tr, article, li'
    ) || btn.parentElement || document.body;
  }

  function existingPanel(host){
    return host && host.querySelector ? host.querySelector('.edt-inline-session') : null;
  }

  function setButtonState(btn, open){
    if(!btn) return;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');

    var textNode = Array.from(btn.childNodes).find(function(n){
      return n.nodeType === Node.TEXT_NODE && /séance complète/i.test(n.textContent || '');
    });

    var value = open ? ' Masquer la séance complète' : ' Ouvrir la séance complète';
    if(textNode){
      textNode.textContent = value;
    }else if(btn.children.length === 0){
      btn.textContent = open ? '▴ Masquer la séance complète' : '🟪 Ouvrir la séance complète';
    }
  }

  function collapse(btn, panel){
    if(panel) panel.hidden = true;
    setButtonState(btn, false);
  }

  function showInline(btn, url){
    if(!btn || !url) return null;

    var host = hostFor(btn);
    var panel = existingPanel(host);

    if(panel){
      panel.hidden = false;
      var frame0 = panel.querySelector('iframe');
      if(frame0 && frame0.src !== new URL(url, location.href).href){
        frame0.src = new URL(url, location.href).href;
      }
      setButtonState(btn, true);
      return panel;
    }

    panel = document.createElement('section');
    panel.className = 'edt-inline-session';
    panel.setAttribute('aria-label','Séance complète');

    var head = document.createElement('div');
    head.className = 'edt-inline-session__head';

    var title = document.createElement('span');
    title.textContent = '📘 Séance complète';

    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'edt-inline-session__close';
    close.textContent = 'Masquer';

    head.appendChild(title);
    head.appendChild(close);

    var frame = document.createElement('iframe');
    frame.className = 'edt-inline-session__frame';
    frame.title = 'Séance complète';
    frame.loading = 'eager';
    frame.src = new URL(url, location.href).href;

    panel.appendChild(head);
    panel.appendChild(frame);

    var insertAfter = btn.closest('.session-resource-action, .resource-action, .lesson-action') || btn;
    insertAfter.insertAdjacentElement('afterend', panel);

    setButtonState(btn, true);

    close.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      collapse(btn, panel);
    });

    return panel;
  }

  // Cas 1 : le bouton est un vrai lien <a href="...">.
  document.addEventListener('click', function(e){
    var btn = closestSessionControl(e.target);
    if(!btn) return;

    var host = hostFor(btn);
    var panel = existingPanel(host);

    if(/masquer la séance complète/i.test(label(btn)) && panel){
      e.preventDefault();
      e.stopImmediatePropagation();
      collapse(btn, panel);
      return;
    }

    var link = btn.matches && btn.matches('a[href]') ? btn : btn.closest && btn.closest('a[href]');
    if(link && link.getAttribute('href')){
      var href = link.getAttribute('href');
      if(href && href !== '#' && !/^javascript:/i.test(href)){
        e.preventDefault();
        e.stopImmediatePropagation();
        showInline(btn, href);
        return;
      }
    }

    // Cas 2 : bouton JS. On laisse SON gestionnaire fonctionner.
    // Il appellera window.open avec l'URL calculée.
    sessionClickButton = btn;
    window.setTimeout(function(){
      sessionClickButton = null;
    }, 250);
  }, true);

  // Intercepte uniquement l'ouverture provoquée par le bouton "séance complète".
  window.open = function(url, target, features){
    if(sessionClickButton && url){
      var btn = sessionClickButton;
      sessionClickButton = null;
      showInline(btn, url);
      return {
        closed:false,
        focus:function(){},
        close:function(){}
      };
    }
    return nativeOpen ? nativeOpen.call(window, url, target, features) : null;
  };

  function prepare(){
    document.querySelectorAll('a,button,[role="button"]').forEach(function(el){
      if(isSessionControl(el) && !el.hasAttribute('aria-expanded')){
        el.setAttribute('aria-expanded','false');
      }
    });
  }

  prepare();
  new MutationObserver(prepare).observe(document.body,{childList:true,subtree:true});
})();
</script>

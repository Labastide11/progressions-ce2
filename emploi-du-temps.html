<script id="dictation-visible-in-edt-v3692">
/* V36.95 — Afficher la dictée réelle directement dans la séance du matin.
   Source unique : DICTEES_CE2. Aucun texte de dictée n'est dupliqué ici. */
(function(){
  'use strict';

  function clean(s){
    return String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function words(v){
    return Array.isArray(v) ? v.join(' · ') : String(v || '').trim();
  }

  function flashes(plan){
    if(!plan) return [];
    var src = Array.isArray(plan.flashes) ? plan.flashes :
              (Array.isArray(plan.flash) ? plan.flash : []);
    return src.map(function(item){
      return Array.isArray(item) ? item[item.length - 1] : item;
    }).filter(Boolean);
  }

  function frenchDate(label){
    var months={
      janvier:0,fevrier:1,février:1,mars:2,avril:3,mai:4,juin:5,
      juillet:6,aout:7,août:7,septembre:8,octobre:9,novembre:10,
      decembre:11,décembre:11
    };
    var s=clean(label).replace(/\b1er\b/g,'1');
    var m=s.match(/(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
    if(!m || months[m[2]]===undefined) return null;
    return new Date(Number(m[3]),months[m[2]],Number(m[1]),12,0,0);
  }

  function dictation(plan, date){
    if(!plan || !date) return null;
    var day=date.getDay(), fs=flashes(plan), label='Dictée du jour', value='';

    if(day===1){
      label='Dictée de mots';
      value=words(plan.priority || plan.words);
      if(/^pas de banque/i.test(value)) value=String(plan.note || '');
    } else if(day===2){
      value=fs[0] || plan.final || words(plan.words);
    } else if(day===4){
      value=fs[1] || fs[0] || plan.final || words(plan.words);
    } else if(day===5){
      value=fs[2] || fs[1] || fs[0] || plan.final || words(plan.words);
      if(plan.final && value !== plan.final){
        value += '<br><strong>⭐ Dictée bilan :</strong> ' + plan.final;
      }
    }

    if(!value) return null;
    return {
      label: label,
      theme: String(plan.theme || plan.support || ''),
      value: value
    };
  }

  function stripGeneric(text){
    return String(text || '')
      .replace(/(?:<br>\s*)?✍️\s*(?:<strong>)?Dictée du jour(?:<\/strong>)?\s*:\s*écrire la dictée(?:,\s*puis faire la correction juste en dessous\.?)?/gi,'')
      .replace(/(?:<br>\s*)?✅\s*(?:<strong>)?Correction(?:<\/strong>)?\s*:\s*corriger juste en dessous\.?/gi,'')
      .replace(/\s{2,}/g,' ')
      .trim();
  }

  function enrich(){
    var data=window.PROGRESSIONS_EDT_DATA || {};
    var bank=window.DICTEES_CE2 || {};
    var weeks=data.p1DetailedWeeks;
    if(!Array.isArray(weeks) || !bank.p1) return;

    weeks.forEach(function(week, wi){
      if(!week || !Array.isArray(week.days)) return;
      var plan=bank.p1[wi + 1];
      if(!plan) return;

      week.days.forEach(function(dayEntry){
        if(!Array.isArray(dayEntry) || !Array.isArray(dayEntry[1])) return;
        var date=frenchDate(dayEntry[0]);
        var d=dictation(plan,date);
        if(!d) return;

        var row=dayEntry[1].find(function(r){
          return Array.isArray(r) && /^9h/.test(String(r[0]||'')) &&
                 !/évaluation nationale/i.test(String(r[1]||'')+' '+String(r[2]||''));
        });
        if(!row) return;

        var base=stripGeneric(row[2]);
        var theme=d.theme ? ' — ' + d.theme : '';
        var block =
          '<br><br>✍️ <strong>' + d.label + theme + '</strong>' +
          '<br><span class="dictation-exact">' + d.value + '</span>' +
          '<br>✅ <strong>Correction :</strong> juste en dessous dans le cahier du jour.';

        if(clean(base).indexOf(clean(d.value.replace(/<[^>]+>/g,' ')))===-1){
          row[2]=base + block;
        }
      });
    });
  }

  enrich();
})();
</script>

<script>
/* V36.47 — démarrage de la vraie page emploi du temps selon l'URL. */
(function(){
  'use strict';

  function start(){
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode') || 'period';
    var period = (params.get('period') || 'p1').toLowerCase();

    window.setTimeout(function(){
      if (mode === 'day') {
        var dayBtn = document.getElementById('openTimetableDetailBtn');
        if (dayBtn) dayBtn.click();
        return;
      }

      if (mode === 'summary') {
        var summaryBtn = document.getElementById('openTimetableSummaryBtn');
        if (summaryBtn) summaryBtn.click();
        return;
      }

      var periodBtn = document.querySelector('[data-open-summary-period="' + period + '"]');
      if (!periodBtn) periodBtn = document.querySelector('[data-open-summary-period="p1"]');
      if (periodBtn) periodBtn.click();
    }, 120);
  }

  document.addEventListener('click', function(e){
    var close = e.target.closest('#closeTimetableBtn');
    if (close) {
      e.preventDefault();
      e.stopImmediatePropagation();
      window.location.href = 'index.html';
    }
  }, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

<script id="edt-inline-session-v3695">
/*
 V36.95 — La séance complète ne remplace plus la journée.
 Principe :
 1. conserver les vrais nœuds de la journée (donc leurs événements et leur état) ;
 2. laisser le code historique générer la séance complète ;
 3. récupérer ce rendu ;
 4. remettre les nœuds de la journée ;
 5. placer la séance complète juste sous le bouton qui l'a ouverte.
*/
(function(){
  'use strict';

  var busy = false;
  var openPanels = new WeakMap();

  function cleanText(el){
    return String(el && el.textContent || '').replace(/\s+/g,' ').trim();
  }

  function isOpenButton(el){
    return !!el && /ouvrir la séance complète/i.test(cleanText(el));
  }

  function findButton(target){
    if(!target || !target.closest) return null;
    var el = target.closest('button,a,[role="button"]');
    if(el && isOpenButton(el)) return el;
    return null;
  }

  function contentRoot(){
    return document.getElementById('timetableContent');
  }

  function setLabel(btn, opened){
    if(!btn) return;
    btn.setAttribute('aria-expanded', opened ? 'true' : 'false');

    var txt = opened ? ' Masquer la séance complète' : ' Ouvrir la séance complète';
    var changed = false;

    Array.from(btn.childNodes).forEach(function(n){
      if(!changed && n.nodeType === 3 && /séance complète/i.test(n.textContent || '')){
        n.textContent = txt;
        changed = true;
      }
    });

    if(!changed && btn.children.length === 0){
      btn.textContent = opened ? '▴ Masquer la séance complète' : '🟪 Ouvrir la séance complète';
    }
  }

  function closePanel(btn){
    var panel = openPanels.get(btn);
    if(panel && panel.parentNode) panel.remove();
    openPanels.delete(btn);
    setLabel(btn,false);
  }

  function placePanel(btn, generatedNodes){
    var panel = document.createElement('section');
    panel.className = 'edt-inline-full-session';

    var bar = document.createElement('div');
    bar.className = 'edt-inline-full-session__bar';

    var title = document.createElement('div');
    title.className = 'edt-inline-full-session__title';
    title.textContent = '📘 Séance complète';

    var close = document.createElement('button');
    close.type = 'button';
    close.className = 'edt-inline-full-session__close';
    close.textContent = 'Masquer la séance';

    bar.appendChild(title);
    bar.appendChild(close);

    var body = document.createElement('div');
    body.className = 'edt-inline-full-session__body';

    generatedNodes.forEach(function(node){
      body.appendChild(node);
    });

    panel.appendChild(bar);
    panel.appendChild(body);

    // Retirer visuellement le bouton historique "Retour à la journée"
    // s'il existe dans le rendu détaillé.
    body.querySelectorAll('button,a').forEach(function(el){
      if(/retour à la journée/i.test(cleanText(el))){
        el.classList.add('edt-inline-hide-return');
      }
    });

    var anchor = btn.closest('.session-resource-action,.resource-action,.lesson-action') || btn;
    anchor.insertAdjacentElement('afterend', panel);

    openPanels.set(btn,panel);
    setLabel(btn,true);

    close.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      closePanel(btn);
      btn.scrollIntoView({block:'nearest'});
    });

    return panel;
  }

  function captureAndRestore(btn, e){
    if(busy) return;

    var root = contentRoot();
    if(!root) return;

    // Un second clic masque simplement la séance.
    if(openPanels.has(btn)){
      e.preventDefault();
      e.stopImmediatePropagation();
      closePanel(btn);
      return;
    }

    busy = true;

    // Empêche uniquement une éventuelle navigation native d'un <a>.
    // Les gestionnaires JavaScript déjà existants continuent, eux, à s'exécuter.
    if(btn.tagName === 'A') e.preventDefault();

    var saved = document.createDocumentFragment();
    while(root.firstChild){
      saved.appendChild(root.firstChild);
    }

    var scrollY = window.scrollY;

    function finish(attempt){
      // Le code existant peut rendre la fiche immédiatement ou avec un léger délai.
      if(root.childNodes.length === 0 && attempt < 8){
        window.setTimeout(function(){ finish(attempt+1); }, 35);
        return;
      }

      var generated = [];
      while(root.firstChild){
        generated.push(root.removeChild(root.firstChild));
      }

      // Remet exactement les nœuds de la journée : pas de clone,
      // donc les événements, selects, statuts et états restent conservés.
      root.appendChild(saved);

      if(generated.length){
        placePanel(btn,generated);
      }else{
        // Sécurité : si aucun rendu n'a été produit, la journée reste intacte.
        setLabel(btn,false);
      }

      window.scrollTo({top:scrollY,behavior:'auto'});
      busy = false;
    }

    window.setTimeout(function(){ finish(0); },0);
  }

  document.addEventListener('click',function(e){
    var btn = findButton(e.target);
    if(!btn) return;
    captureAndRestore(btn,e);
  },true);
})();
</script>

<script>
/* V36.47 — démarrage de la vraie page emploi du temps selon l'URL. */
(function(){
  'use strict';

  function start(){
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode') || 'period';
    var period = (params.get('period') || 'p1').toLowerCase();

    window.setTimeout(function(){
      if (mode === 'day') {
        var dayBtn = document.getElementById('openTimetableDetailBtn');
        if (dayBtn) dayBtn.click();
        return;
      }

      if (mode === 'summary') {
        var summaryBtn = document.getElementById('openTimetableSummaryBtn');
        if (summaryBtn) summaryBtn.click();
        return;
      }

      var periodBtn = document.querySelector('[data-open-summary-period="' + period + '"]');
      if (!periodBtn) periodBtn = document.querySelector('[data-open-summary-period="p1"]');
      if (periodBtn) periodBtn.click();
    }, 120);
  }

  document.addEventListener('click', function(e){
    var close = e.target.closest('#closeTimetableBtn');
    if (close) {
      e.preventDefault();
      e.stopImmediatePropagation();
      window.location.href = 'index.html';
    }
  }, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

<script>
/* V36.78 — garde-fou autonome pour ?mode=day.
   Si le moteur principal n'a rien rendu, cette page affiche directement
   la journée courante ou la prochaine journée de classe depuis les données. */
(function(){
  'use strict';

  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  var months={janvier:0,fevrier:1,'février':1,mars:2,avril:3,mai:4,juin:5,juillet:6,aout:7,'août':7,septembre:8,octobre:9,novembre:10,decembre:11,'décembre':11};
  function parseDay(label){
    var s=String(label||'').toLowerCase().replace(/1er/g,'1').replace(/\s+/g,' ').trim();
    var m=s.match(/(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})\s+([a-zàâäéèêëîïôöùûüç]+)\s+(\d{4})/i);
    if(!m || !(m[2] in months)) return null;
    return new Date(Number(m[3]),months[m[2]],Number(m[1]),12,0,0,0);
  }
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function startMinutes(range){
    var m=String(range||'').match(/(\d{1,2})h(?:(\d{2}))?/i);
    return m ? Number(m[1])*60+Number(m[2]||0) : 0;
  }
  function collectDays(){
    var data=window.PROGRESSIONS_EDT_DATA||{};
    var groups=[
      ['p1',data.p1DetailedWeeks],['p2',data.p2DetailedWeeks],['p3',data.p3DetailedWeeks],
      ['p4',data.p4DetailedWeeks],['p5',data.p5DetailedWeeks]
    ];
    var out=[];
    groups.forEach(function(g){
      (Array.isArray(g[1])?g[1]:[]).forEach(function(week){
        (Array.isArray(week.days)?week.days:[]).forEach(function(dayPair){
          var d=parseDay(dayPair[0]);
          if(d) out.push({period:g[0],week:week,label:dayPair[0],rows:dayPair[1]||[],date:d,key:key(d)});
        });
      });
    });
    out.sort(function(a,b){return a.date-b.date;});
    return out;
  }
  function sessionDocs(row){
    var meta=row && row[7];
    var docs=meta && Array.isArray(meta.documents) ? meta.documents : [];
    if(!docs.length) return '';
    return '<div class="daily-fallback-docs">'+docs.map(function(doc){
      return '<a href="'+esc(doc.url)+'" target="_blank" rel="noopener">📄 '+esc(doc.titre||'Document')+'</a>';
    }).join('')+'</div>';
  }
  function render(entry,session){
    var content=document.getElementById('timetableContent');
    var tabs=document.getElementById('timetableTabs');
    if(!content || !entry) return false;
    if(tabs) tabs.style.display='none';
    var rows=entry.rows;
    if(session==='morning') rows=rows.filter(function(r){return startMinutes(r[0])<720;});
    if(session==='afternoon') rows=rows.filter(function(r){return startMinutes(r[0])>=840;});
    var labels={day:'Journée complète',morning:'Matin',afternoon:'Après-midi'};
    content.innerHTML=
      '<section class="detail-view daily-timetable-view">'+
      '<div class="detail-top daily-detail-top"><div><span class="detail-zone">Emploi du temps de la journée</span><h2>'+esc(entry.label)+'</h2><p>'+labels[session]+'</p></div></div>'+
      '<div class="daily-session-tabs" role="group" aria-label="Choisir la partie de la journée">'+
      '<button type="button" data-fallback-session="day" class="'+(session==='day'?'is-active':'')+'">Journée complète</button>'+
      '<button type="button" data-fallback-session="morning" class="'+(session==='morning'?'is-active':'')+'">Matin</button>'+
      '<button type="button" data-fallback-session="afternoon" class="'+(session==='afternoon'?'is-active':'')+'">Après-midi</button></div>'+
      '<section class="detail-day daily-only-day"><div class="detail-day-head"><h3>'+esc(entry.label)+'</h3></div><div class="detail-table-wrap">'+
      '<table class="detail-table detail-table--p1"><thead><tr><th>Horaire</th><th>Domaine / activité</th><th>Compétence</th><th>Séance détaillée</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr><td class="detail-time">'+esc(r[0])+'</td><td><strong>'+esc(r[1])+'</strong></td><td class="detail-competence-cell">'+(r[3]||'')+'</td><td class="detail-session-cell detail-session-wide">'+(r[2]||'')+sessionDocs(r)+'</td></tr>';}).join('')+
      '</tbody></table></div></section></section>';
    content.dataset.dayFallback='1';
    content.onclick=function(e){
      var b=e.target.closest('[data-fallback-session]');
      if(b){e.preventDefault();render(entry,b.getAttribute('data-fallback-session'));}
    };
    return true;
  }
  function boot(){
    var params=new URLSearchParams(location.search);
    if(params.get('mode')!=='day') return;
    window.setTimeout(function(){
      var content=document.getElementById('timetableContent');
      if(!content || content.textContent.trim()) return;
      var days=collectDays();
      if(!days.length){
        content.innerHTML='<section class="detail-view"><div class="detail-top"><div><h2>Emploi du temps de la journée</h2><p>Les données de la période ne sont pas disponibles.</p></div></div></section>';
        return;
      }
      var now=new Date(); now=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0,0);
      var today=key(now);

      /* V36.78 — ne jamais sauter directement à la période suivante.
         On cherche d'abord dans la période scolaire correspondant à la date du jour. */
      function currentPeriod(d){
        var y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
        if(y!==2026 && y!==2027) return null;
        var n=(y*10000)+((m+1)*100)+day;
        if(n>=20260901 && n<=20261016) return 'p1';
        if(n>=20261102 && n<=20261218) return 'p2';
        if(n>=20270104 && n<=20270219) return 'p3';
        if(n>=20270308 && n<=20270416) return 'p4';
        if(n>=20270503 && n<=20270706) return 'p5';
        return null;
      }

      var period=currentPeriod(now);
      var periodDays=period ? days.filter(function(x){return x.period===period;}) : days;
      var exact=periodDays.find(function(x){return x.key===today;});

      if(exact){
        render(exact,'day');
        return;
      }

      /* Mercredi / week-end / vacances : message clair + prochaine journée de classe,
         sans basculer silencieusement sur novembre ou une autre période. */
      var next=periodDays.find(function(x){return x.date>now;});
      var weekday=now.getDay();
      if(weekday===0 || weekday===3 || weekday===6 || !next){
        var label = (weekday===3 || weekday===0 || weekday===6)
          ? 'Pas de classe aujourd’hui.'
          : 'Aucune journée de classe prévue aujourd’hui.';
        var nextHtml = next
          ? '<p><button type="button" id="fallbackNextSchoolDay">Voir la prochaine journée d’école — '+esc(next.label)+'</button></p>'
          : '<p>La prochaine journée n’est pas disponible dans les données chargées.</p>';
        content.innerHTML='<section class="detail-view daily-timetable-view"><div class="detail-top daily-detail-top"><div><span class="detail-zone">Emploi du temps de la journée</span><h2>'+label+'</h2>'+nextHtml+'</div></div></section>';
        var b=document.getElementById('fallbackNextSchoolDay');
        if(b && next) b.addEventListener('click',function(){render(next,'day');});
        return;
      }

      if(next){
        render(next,'day');
        return;
      }

      content.innerHTML='<section class="detail-view"><div class="detail-top"><div><h2>Emploi du temps de la journée</h2><p>Les données de la période '+esc(period||'courante')+' ne sont pas chargées.</p></div></div></section>';
    },500);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>

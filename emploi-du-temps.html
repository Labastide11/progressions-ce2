<script id="dictation-visible-in-edt-v3692">
/* V37.05 — Afficher la dictée réelle directement dans la séance du matin.
   Source unique : DICTEES_CE2. Aucun texte de dictée n'est dupliqué ici. */
(function(){
  'use strict';

  function clean(s){
    return String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function words(v){
    return Array.isArray(v) ? v.join(' · ') : String(v || '').trim();
  }

  function flashes(plan){
    if(!plan) return [];
    var src = Array.isArray(plan.flashes) ? plan.flashes :
              (Array.isArray(plan.flash) ? plan.flash : []);
    return src.map(function(item){
      return Array.isArray(item) ? item[item.length - 1] : item;
    }).filter(Boolean);
  }

  function frenchDate(label){
    var months={
      janvier:0,fevrier:1,février:1,mars:2,avril:3,mai:4,juin:5,
      juillet:6,aout:7,août:7,septembre:8,octobre:9,novembre:10,
      decembre:11,décembre:11
    };
    var s=clean(label).replace(/\b1er\b/g,'1');
    var m=s.match(/(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s+(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
    if(!m || months[m[2]]===undefined) return null;
    return new Date(Number(m[3]),months[m[2]],Number(m[1]),12,0,0);
  }

  function dictation(plan, date){
    if(!plan || !date) return null;
    var day=date.getDay(), fs=flashes(plan), label='Dictée du jour', value='';

    if(day===1){
      label='Dictée de mots';
      value=words(plan.priority || plan.words);
      if(/^pas de banque/i.test(value)) value=String(plan.note || '');
    } else if(day===2){
      value=fs[0] || plan.final || words(plan.words);
    } else if(day===4){
      value=fs[1] || fs[0] || plan.final || words(plan.words);
    } else if(day===5){
      value=fs[2] || fs[1] || fs[0] || plan.final || words(plan.words);
      if(plan.final && value !== plan.final){
        value += '<br><strong>⭐ Dictée bilan :</strong> ' + plan.final;
      }
    }

    if(!value) return null;
    return {
      label: label,
      theme: String(plan.theme || plan.support || ''),
      value: value
    };
  }

  function stripGeneric(text){
    return String(text || '')
      .replace(/(?:<br>\s*)?✍️\s*(?:<strong>)?Dictée du jour(?:<\/strong>)?\s*:\s*écrire la dictée(?:,\s*puis faire la correction juste en dessous\.?)?/gi,'')
      .replace(/(?:<br>\s*)?✅\s*(?:<strong>)?Correction(?:<\/strong>)?\s*:\s*corriger juste en dessous\.?/gi,'')
      .replace(/\s{2,}/g,' ')
      .trim();
  }

  function enrich(){
    var data=window.PROGRESSIONS_EDT_DATA || {};
    var bank=window.DICTEES_CE2 || {};
    var weeks=data.p1DetailedWeeks;
    if(!Array.isArray(weeks) || !bank.p1) return;

    weeks.forEach(function(week, wi){
      if(!week || !Array.isArray(week.days)) return;
      var plan=bank.p1[wi + 1];
      if(!plan) return;

      week.days.forEach(function(dayEntry){
        if(!Array.isArray(dayEntry) || !Array.isArray(dayEntry[1])) return;
        var date=frenchDate(dayEntry[0]);
        var d=dictation(plan,date);
        if(!d) return;

        var row=dayEntry[1].find(function(r){
          return Array.isArray(r) && /^9h/.test(String(r[0]||'')) &&
                 !/évaluation nationale/i.test(String(r[1]||'')+' '+String(r[2]||''));
        });
        if(!row) return;

        var base=stripGeneric(row[2]);
        var theme=d.theme ? ' — ' + d.theme : '';
        var block =
          '<br><br>✍️ <strong>' + d.label + theme + '</strong>' +
          '<br><span class="dictation-exact">' + d.value + '</span>' +
          '<br>✅ <strong>Correction :</strong> juste en dessous dans le cahier du jour.';

        if(clean(base).indexOf(clean(d.value.replace(/<[^>]+>/g,' ')))===-1){
          row[2]=base + block;
        }
      });
    });
  }

  enrich();
})();
</script>

<script>
/* V36.47 — démarrage de la vraie page emploi du temps selon l'URL. */
(function(){
  'use strict';

  function start(){
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode') || 'period';
    var period = (params.get('period') || 'p1').toLowerCase();

    window.setTimeout(function(){
      if (mode === 'day') {
        var dayBtn = document.getElementById('openTimetableDetailBtn');
        if (dayBtn) dayBtn.click();
        return;
      }

      if (mode === 'summary') {
        var summaryBtn = document.getElementById('openTimetableSummaryBtn');
        if (summaryBtn) summaryBtn.click();
        return;
      }

      var periodBtn = document.querySelector('[data-open-summary-period="' + period + '"]');
      if (!periodBtn) periodBtn = document.querySelector('[data-open-summary-period="p1"]');
      if (periodBtn) periodBtn.click();
    }, 120);
  }

  document.addEventListener('click', function(e){
    var close = e.target.closest('#closeTimetableBtn');
    if (close) {
      e.preventDefault();
      e.stopImmediatePropagation();
      window.location.href = 'index.html';
    }
  }, true);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

<script id="edt-session-modal-v3696">
/*
 V37.05 — Ouverture de la séance complète dans une popup.
 La journée reste intacte derrière la modale.
*/
(function(){
  'use strict';

  var busy = false;
  var modal = document.getElementById('edtSessionModal');
  var modalBody = document.getElementById('edtSessionModalBody');
  var closeBtn = document.getElementById('edtSessionModalClose');
  var previousScrollY = 0;

  function txt(el){
    return String(el && el.textContent || '').replace(/\s+/g,' ').trim();
  }

  function isOpenButton(el){
    return !!el && /ouvrir la séance complète/i.test(txt(el));
  }

  function findButton(target){
    if(!target || !target.closest) return null;
    var el = target.closest('button,a,[role="button"]');
    return isOpenButton(el) ? el : null;
  }

  function root(){
    return document.getElementById('timetableContent');
  }

  function removeIrrelevantDictationBlocks(){
    var heading = modalBody.querySelector('h1,h2,.lesson-title,.session-title');
    var title = String(heading ? heading.textContent : '').replace(/\s+/g,' ').trim();

    // Le corpus reste uniquement pour une séance explicitement consacrée
    // à la dictée ou à l'orthographe.
    if(/dictée|orthographe/i.test(title)) return;

    function ownText(el){
      return String(el && el.textContent || '').replace(/\s+/g,' ').trim();
    }

    function looksLikeDictationOnly(el){
      var t = ownText(el);
      if(!t) return false;

      var hasDictation =
        /Dictée\s*[—-]\s*semaine/i.test(t) ||
        /Corpus Charivari intégré/i.test(t) ||
        /Dictée finale originale/i.test(t);

      if(!hasDictation) return false;

      // Sécurité : ne jamais supprimer un gros conteneur qui contient
      // aussi les parties essentielles de la séance.
      var hasLessonContent =
        /Objectifs/i.test(t) ||
        /Déroulement enseignant/i.test(t) ||
        /Projection élèves/i.test(t) ||
        /Matériel/i.test(t) ||
        /Étape|Etape/i.test(t);

      return !hasLessonContent;
    }

    Array.from(modalBody.querySelectorAll('h1,h2,h3,h4,h5,strong,b,p,div')).forEach(function(el){
      var t = ownText(el);

      var isTarget =
        /^Dictée\s*[—-]\s*semaine/i.test(t) ||
        /^Corpus Charivari intégré/i.test(t) ||
        /^Dictée finale originale/i.test(t);

      if(!isTarget) return;

      var node = el;
      var candidate = null;

      for(var i=0; i<4 && node && node !== modalBody; i++){
        if(looksLikeDictationOnly(node)){
          candidate = node;
        }
        node = node.parentElement;
      }

      if(candidate && candidate !== modalBody){
        candidate.remove();
      } else {
        // Repli sûr : on masque seulement le texte ciblé.
        el.style.display = 'none';
      }
    });

    Array.from(modalBody.querySelectorAll('a,button')).forEach(function(el){
      var t = ownText(el);
      if(/^Voir le détail$/i.test(t)){
        var parentText = ownText(el.parentElement);
        if(/Dictée|Charivari/i.test(parentText)){
          el.style.display = 'none';
        }
      }
    });

    // V37.05 — alléger les popups de séances de maths :
    // masquer les blocs de programmation annuelle et la progression spiralaire
    // des fractions, trop volumineux pour une consultation ponctuelle.
    function removePopupSectionByTitle(regex){
      Array.from(modalBody.querySelectorAll('h1,h2,h3,h4,h5,h6,strong,b,div,p')).forEach(function(el){
        var t = ownText(el);
        if(!regex.test(t)) return;

        var node = el;
        var candidate = null;

        // On remonte prudemment jusqu'à une section/carte autonome,
        // sans jamais supprimer le conteneur global de la séance.
        for(var i=0; i<5 && node && node !== modalBody; i++){
          if(
            node.matches &&
            node.matches('section,article,.card,.panel,.box,.lesson-card,.session-card,.detail-card,.fiche-card')
          ){
            candidate = node;
            break;
          }
          node = node.parentElement;
        }

        if(candidate && candidate !== modalBody){
          candidate.remove();
        } else {
          el.style.display = 'none';
        }
      });
    }

    removePopupSectionByTitle(/^🗓️?\s*Découpage mathématique annuel prévu avec Maître Hibou$/i);
    removePopupSectionByTitle(/^🍰?\s*Progression spiralaire des fractions\s*[—-]\s*P1 à P5$/i);
  }

  function openModal(nodes){
    modalBody.innerHTML = '';
    nodes.forEach(function(node){
      modalBody.appendChild(node);
    });

    removeIrrelevantDictationBlocks();

    // Masquer le bouton historique "Retour à la semaine/journée" dans la popup
    // ainsi que "Projection élèves", inutile ici.
    modalBody.querySelectorAll('button,a').forEach(function(el){
      var t = txt(el);

      if(/retour à la semaine|retour à la journée/i.test(t)){
        el.style.display = 'none';
      }

      if(/Projection\s+élèves/i.test(t)){
        el.style.display = 'none';
      }
    });

    modalBody.querySelectorAll('button,a,[role="button"]').forEach(function(el){
      var projectionLabel=String(el.textContent||'').replace(/\s+/g,' ').trim();
      if(/Projection\s+élèves/i.test(projectionLabel)){
        el.style.display='none';
      }
    });

    previousScrollY = window.scrollY;
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('edt-session-modal-open');
    modalBody.scrollTop = 0;
  }

  function closeModal(){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
    document.body.classList.remove('edt-session-modal-open');
    modalBody.innerHTML = '';
    window.scrollTo({top:previousScrollY, behavior:'auto'});
  }

  closeBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', function(e){
    if(e.target === modal) closeModal();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modal.classList.contains('is-open')){
      closeModal();
    }
  });

  document.addEventListener('click', function(e){
    var btn = findButton(e.target);
    if(!btn || busy) return;

    var content = root();
    if(!content) return;

    busy = true;

    // Empêche seulement une navigation native de <a>.
    // Les gestionnaires JS du site continuent à tourner.
    if(btn.tagName === 'A') e.preventDefault();

    // On retire temporairement les vrais nœuds de la journée.
    // Ils restent intacts (événements, selects, états).
    var saved = document.createDocumentFragment();
    while(content.firstChild){
      saved.appendChild(content.firstChild);
    }

    function finish(attempt){
      if(content.childNodes.length === 0 && attempt < 10){
        window.setTimeout(function(){ finish(attempt+1); }, 35);
        return;
      }

      var generated = [];
      while(content.firstChild){
        generated.push(content.removeChild(content.firstChild));
      }

      // Restaurer immédiatement la journée
      content.appendChild(saved);

      if(generated.length){
        openModal(generated);
      }

      busy = false;
    }

    window.setTimeout(function(){ finish(0); }, 0);
  }, true);
})();
</script>


<script id="edt-hide-duplicate-day-date-v3703-js">
(function(){
  'use strict';

  function norm(s){
    return String(s||'').replace(/\s+/g,' ').trim();
  }

  function cleanDuplicateDate(){
    var root=document.getElementById('timetableContent');
    if(!root) return;

    var headings=Array.from(root.querySelectorAll('h1,h2,h3,strong,.day-detail-date,.day-view-date,.timetable-day-date,.detail-day-title'));
    var datePattern=/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi|Samedi|Dimanche)\s+\d{1,2}(?:er)?\s+[A-Za-zÀ-ÿ]+\s+\d{4}$/i;
    var seen={};

    headings.forEach(function(el){
      var t=norm(el.textContent);
      if(!datePattern.test(t)) return;
      if(seen[t]){
        el.style.display='none';
      }else{
        seen[t]=true;
      }
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',cleanDuplicateDate);
  }else{
    cleanDuplicateDate();
  }

  new MutationObserver(cleanDuplicateDate).observe(
    document.getElementById('timetableContent') || document.body,
    {childList:true,subtree:true}
  );
})();
</script>

<script id="riddle-projection-v3705">
(function(){
  'use strict';

  var modal=document.getElementById('riddleProjectModal');
  var body=document.getElementById('riddleProjectBody');
  var closeBtn=document.getElementById('riddleProjectClose');

  function cleanText(s){
    return String(s||'').replace(/\s+/g,' ').trim();
  }

  function extractRiddles(container){
    if(!container) return [];
    var txt=container.innerText || container.textContent || '';
    var lines=txt.split(/\n+/).map(cleanText).filter(Boolean);
    var out=[];

    lines.forEach(function(line){
      var m=line.match(/^([1-3])\)\s*(.+)$/);
      if(!m) return;

      // Pour la projection élèves, on masque volontairement le mot-réponse
      // placé avant les deux-points, s'il est présent.
      var content=m[2].replace(/^[^:]{1,40}\s*:\s*/, '');
      out.push({n:m[1], text:content});
    });

    return out;
  }

  function openProjection(source){
    var riddles=extractRiddles(source);
    if(!riddles.length) return;

    body.innerHTML='';
    riddles.forEach(function(r){
      var card=document.createElement('div');
      card.className='riddle-project-card';

      var num=document.createElement('span');
      num.className='riddle-project-num';
      num.textContent=r.n;

      var text=document.createElement('span');
      text.textContent=r.text;

      card.appendChild(num);
      card.appendChild(text);
      body.appendChild(card);
    });

    var foot=document.createElement('div');
    foot.className='riddle-project-footer';
    foot.textContent='Cherche les indices avant de proposer une réponse.';
    body.appendChild(foot);

    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
  }

  function closeProjection(){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
    body.innerHTML='';
  }

  closeBtn.addEventListener('click',closeProjection);
  modal.addEventListener('click',function(e){
    if(e.target===modal) closeProjection();
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && modal.classList.contains('is-open')) closeProjection();
  });

  function enhance(){
    var root=document.getElementById('timetableContent') || document;

    root.querySelectorAll('*').forEach(function(el){
      if(el.dataset && el.dataset.riddleProjectionEnhanced==='1') return;

      var t=cleanText(el.textContent);
      if(!/Rituel\s*:\s*Rituel Devinette/i.test(t)) return;
      if(!/1\)/.test(t) || !/2\)/.test(t) || !/3\)/.test(t)) return;

      // Chercher le plus petit conteneur utile, sans remonter jusqu'à toute la ligne.
      var source=el;
      while(
        source.parentElement &&
        source.parentElement !== root &&
        cleanText(source.parentElement.textContent).length < 1400
      ){
        source=source.parentElement;
      }

      if(source.querySelector && source.querySelector('.riddle-project-btn')) return;

      var btn=document.createElement('button');
      btn.type='button';
      btn.className='riddle-project-btn';
      btn.textContent='📺 Projeter les devinettes';
      btn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        openProjection(source);
      });

      source.appendChild(btn);
      if(source.dataset) source.dataset.riddleProjectionEnhanced='1';
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',enhance);
  }else{
    enhance();
  }

  new MutationObserver(enhance).observe(
    document.getElementById('timetableContent') || document.body,
    {childList:true,subtree:true}
  );
})();
</script>

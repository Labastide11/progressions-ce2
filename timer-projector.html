<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V34.23 — Vue TBI du temps</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at top,#174e7a,#071b2b);color:white;font-family:system-ui}.wrap{text-align:center}.label{font-size:clamp(1.4rem,3vw,2.8rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}.time{font-size:clamp(7rem,24vw,18rem);font-weight:950;line-height:1;text-shadow:0 10px 30px rgba(0,0,0,.35)}.ended{color:#ffd3c9;animation:pulse .8s infinite alternate}.controls{display:flex;justify-content:center;gap:12px;margin-top:24px}.controls button{border:2px solid #7448c8;border-radius:16px;padding:14px 22px;font:800 1.1rem system-ui;cursor:pointer;background:#7448c8;color:#fff;box-shadow:0 7px 18px rgba(30,12,70,.28)}.controls button:hover{background:#6439b8;border-color:#6439b8}.controls button:focus-visible{outline:3px solid rgba(255,255,255,.75);outline-offset:3px}@keyframes pulse{to{transform:scale(1.04)}}@media print{.controls{display:none}}</style></head><body><main class="wrap"><div class="label" id="label">Minuteur</div><div class="time" id="time">00:00</div><div class="controls"><button id="full">⛶ Plein écran</button><button id="close">✕ Fermer</button></div></main><script>const KEY='progressions_ce2_timer_v1',requested=new URLSearchParams(location.search).get('mode')==='stopwatch'?'stopwatch':'countdown',read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}},cur=s=>s.mode==='countdown'?Math.max(0,s.baseMs-(s.running?Date.now()-s.startedAt:0)):Math.max(0,s.baseMs+(s.running?Date.now()-s.startedAt:0)),fmt=ms=>{const q=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(q/60),x=q%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')};function draw(){const s=read(),t=document.getElementById('time'),l=document.getElementById('label');l.textContent=requested==='stopwatch'?'Chronomètre':'Minuteur';if(!s||s.mode!==requested){t.textContent='00:00';t.classList.remove('ended');return}const end=s.ended||(requested==='countdown'&&cur(s)<=0);l.textContent=end?'Temps écoulé':requested==='stopwatch'?'Chronomètre':'Minuteur';t.textContent=end?'00:00':fmt(cur(s));t.classList.toggle('ended',end)}setInterval(draw,200);draw();addEventListener('storage',draw);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('close').onclick=()=>close();</script></body></html>

const DATA={"texts":["Aujourd’hui, Natacha fait sa première rentrée dans une \nécole où elle va être pensionnaire. Au début, elle se \nsent un peu seule car elle ne voit aucune tête connue. \nDevant tous ces yeux qui la dévisagent, Natacha \nrougit, pâlit, mais elle surmonte sa timidité. « Je finirai \nbien par faire des connaissances », se dit-elle.\nÀ ce \nmoment, une jeune fille vient vers elle :  \n– Bonjour, je m'appelle Patricia. Est-ce que tu es \nnouvelle ici ?\n \n– Oui, je viens d’arriver et je ne connais personne.\n \n– Je suis nouvelle aussi. Veux-tu être mon amie ?\n \nNatacha adresse un sourire à celle qui lui tend la main. \nElle prend cette main et dit :  \n– D'accord ! À deux, la vie sera plus facile et nous \nferons du bon travail !","Notre maison était trop petite. Mes parents ont donc \nfait appel à des professionnels pour l’agrandir. \nD’abord, les maçons ont bâti une pièce \nsupplémentaire. Ils sont venus avec des briques, des \nsacs de ciment, du sable et tout leur matériel. Ils ont \ncoulé une dalle en béton puis ils ont monté les murs. \nLa bétonnière tournait toute la journée !\n \nEnsuite, le couvreur a posé la charpente et les tuiles. \nLa construction était bien avancée. Mais mes parents \nvoulaient un passage entre cette nouvelle pièce et le \nreste de la maison. Pour cela, un ouvrier a cassé une \npartie de l’ancien mur afin d’y installer une porte... \nAlors, un nuage de poussière a envahi la maison ! \nHeureusement, on avait protégé les meubles avec de \nvieux draps.\n \nLes jours suivants, mon père a terminé les travaux \navec le voisin. Ils ont fait les peintures et ils ont posé \nle papier peint. Pour qui était cette belle pièce toute \nneuve ? Pour moi ! J’avais enfin une chambre pour moi \ntout seul !","Ce soir, Emma va au cinéma avec ses parents. Quelle \nfête pour la petite fille !\n \nD’abord l'écran s'allume et devient très brillant. Elle \nvoit des animaux qui vivent dans les grandes forêts \nd'Afrique : d’imposants éléphants, d’énormes serpents \net des papillons géants. Emma prend la main de sa \nmaman : a-t-elle peur ?\n \nMais vient ensuite un dessin animé : Donald, le canard, \ns'est pris le bec dans un grillage et il a beau crier, \npersonne ne l'entend. Amusée, Emma éclate de rire.\n \nÀ l'entracte, elle mange un esquimau au chocolat.\n \nPuis, c'est le grand film. Mais celui-ci est trop long \npour Emma. Elle s'endort et son père doit la porter \ndans la voiture.\n \nUne fois dans son lit, la fillette a tout juste la force \nd’embrasser sa maman. Elle ferme les yeux et pense à \nDonald en s’endormant.","Il était une fois un petit village caché entre deux collines. Au bord du village vivait Lina, une jeune fille qui aimait écouter les histoires de sa grand-mère.\nUn matin, Lina découvrit une minuscule porte bleue au pied d'un vieux chêne. Elle frappa doucement. Une voix lui répondit :\n— Entre, mais n'oublie pas de refermer !\nDerrière la porte habitait un lutin vêtu d'un manteau vert. Sur sa table reposait une graine dorée.\n— Cette graine est magique, expliqua le lutin. Plante-la près de la fontaine et attends demain.\nLina suivit son conseil. Le lendemain, un arbre avait poussé. Ses branches portaient de petites clochettes argentées. Quand le vent soufflait, elles jouaient une musique merveilleuse.\nTous les habitants vinrent écouter. Même les plus pressés s'arrêtèrent quelques instants pour sourire.\nLina retourna remercier le lutin, mais la porte bleue avait disparu. Au pied du chêne, elle trouva seulement un message :\n« Un peu de patience et beaucoup de gentillesse font grandir les merveilles. »\nDepuis ce jour, les villageois prirent davantage le temps de s'entraider.","Marcel ne savait jamais répondre aux questions de la \nmaitresse. Un jour Oumar est arrivé dans l’école avec un \nobjet magique : le Nkoro-Nkoro. Les choses ont changé...\n \nLe lendemain, madame Camife a été très étonnée. Quand \nelle m’a demandé par surprise :\n \n– Marcel, combien font neuf fois neuf ?  \nOumar a murmuré :\n \n– Nkoro-Nkoro, neuf fois neuf, dis-nous vite...\n \nAlors, profond dans ma tête, j’ai entendu une voix grave \nqui m’a dit :\n \n– Quatre-vingt-un !\n \nEt j’ai crié à la maitresse :\n \n– Quatre-vingt-un !\n \nMadame Camife est tombée de l’estrade. Elle est venue \nvers moi. Elle était toute pâle, comme si elle avait attrapé \nla grippe, là tout de suite.\n \n– Marcel... a-t-elle dit, dis-moi voir un peu la surface du \nrectangle ?\n \nEt Oumar, tout près de moi, a chuchoté :\n \n– Nkoro-Nkoro, dis-nous vite...\n \nAlors, profond dans ma tête, la même voix grave m’a dit :\n \n– Longueur multipliée par largeur !\n \nJ’ai répété ce que me disait la Voix, dans ma tête. Madame \nCamife est devenue toute rouge, ce coup-ci. Elle a fait du \nvent avec un cahier, pour avoir de l’air.","On a dix ans : on est grand maintenant !\n \nChaque matin, on fait son lit puis on va dans la salle \nde bain. On prend son petit-déjeuner et on quitte la \nmaison aussitôt. On peut ainsi arriver à l’heure à \nl’école. Le samedi, on fait les courses, on aide maman \nà porter les sacs. On dit bonjour aux amis qu’on voit."],"titles":["Natacha","Les travaux","Au cinéma","La graine dorée","L’objet magique","Les bonnes résolutions"],"counts":[125,172,151,176,194,64],"questions":[[["Pourquoi Natacha se sent-elle seule ?",["Elle ne connaît personne.","Elle a oublié ses affaires.","Elle s’est disputée."],0],["Que propose Patricia ?",["De quitter l’école","De devenir son amie","De faire une course"],1],["Comment réagit Natacha ?",["Elle refuse.","Elle pleure.","Elle accepte."],2]],[["Pourquoi les parents font-ils des travaux ?",["Pour agrandir la maison.","Pour démolir la maison.","Pour changer de ville."],0],["Qui pose la charpente et les tuiles ?",["Le maçon","Le couvreur","Le peintre"],1],["À qui est destinée la nouvelle pièce ?",["Au voisin","Aux parents","À l’enfant qui raconte"],2]],[["Avec qui Emma va-t-elle au cinéma ?",["Ses camarades","Ses parents","Sa maîtresse"],1],["Qu’est-ce qui fait rire Emma ?",["Un dessin animé","Les serpents","Le trajet en voiture"],0],["Pourquoi son père la porte-t-il ?",["Elle est malade.","Elle a peur.","Elle s’est endormie."],2]],[["Où Lina découvre-t-elle une petite porte bleue ?",["Au pied d’un vieux chêne","Sous un pont","Dans sa maison"],0],["Que lui demande le lutin ?",["De cueillir des fleurs","De planter une graine","De chercher une clé"],1],["Que trouve-t-on sur les branches de l’arbre ?",["Des pommes rouges","Des rubans dorés","Des clochettes argentées"],2]],[["Qui apporte le Nkoro-Nkoro ?",["Marcel","Oumar","Madame Camife"],1],["Que donne l’objet magique à Marcel ?",["Des réponses dans sa tête","Un nouvel ami","Un cahier neuf"],0],["Pourquoi la maîtresse est-elle étonnée ?",["Marcel arrive en retard.","Marcel quitte l’école.","Marcel répond correctement."],2]],[["Que fait-on chaque matin ?",["On fait son lit.","On va au cinéma.","On joue au ballon."],0],["Que fait-on le samedi ?",["On va à l’école.","On aide à porter les courses.","On va au restaurant."],1],["Pourquoi veut-on arriver à l’heure ?",["Pour faire des courses","Pour jouer plus longtemps","Pour aller à l’école sans retard"],2]]],"weeks":[["9 au 13 novembre",[["2026-11-09","Fluence — Les travaux"],["2026-11-10","Calcul mental — Automatismes"],["2026-11-12","Français — Noms et pronoms / Dictée"],["2026-11-13","Numération — Ranger des nombres / Fluence — Les travaux"]]],["16 au 20 novembre",[["2026-11-16","Fluence — Au cinéma / Maths — Doubles et moitiés"],["2026-11-17","Conjugaison — Présent / Dictée"],["2026-11-19","Mesures — Longueurs"],["2026-11-20","Calcul — Additionner en décomposant"]]],["23 au 27 novembre",[["2026-11-23","Fluence — La graine dorée / Français — Pronoms"],["2026-11-24","Compréhension — Je prépare mon évaluation / Dictée"],["2026-11-26","Soustractions — 2 calculs / Dictée"],["2026-11-27","Groupes égaux — Le défi des fleurs / Dictée"]]],["30 novembre au 4 décembre",[["2026-11-30","Histoire — Préparation à l’ const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lesson(arr){return (arr||[]).filter(x=>DATA.links[x]).map(x=>`<a class="link" href="${DATA.links[x]||'#'}" target="_blank" rel="noopener">Lien vers la leçon &gt; ${x}</a>`).join('')}
function renderPhotos(items){if(!items||!items.length)return '';return `<div class="item"><div class="label">J’observe</div><div class="photo-grid">${items.map(img=>`<figure><img src="${img.src}" alt="${esc(img.caption)}" loading="lazy"><figcaption>${esc(img.caption)}</figcaption></figure>`).join('')}</div></div>`}
function start(){const el=$('#week');DATA.weeks.forEach((w,i)=>el.add(new Option(`Semaine ${i+2} · ${w[0]}`,i)));el.onchange=()=>{week=+el.value;day=0;draw()};draw()}
function draw(){if(timer)clearInterval(timer);timer=null;sec=60;fluencySelected=0;fluencyFinished=false;const w=DATA.weeks[week],slots=w[1];$('#dates').innerHTML=slots.map((x,i)=>`<button class="${day===i?'active':''}" onclick="day=${i};spellIndex=0;draw()">${new Date(x[0]+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}<br><small>${esc(x[1])}${SPELL_STAGES[week]?.includes(x[0])&&!/Dictée/.test(x[1])?' / Dictée':''}</small>${x[0].endsWith("-11-13")||x[0].endsWith("-11-20")||x[0].endsWith("-11-27")||x[0].endsWith("-12-04")||x[0].endsWith("-12-11")||x[0].endsWith("-12-18")?'<br><span class="swim-tag">Piscine · 14 h–17 h</span>':''}</button>`).join('');let date=slots[day][0],n=slots[day][1];if(spellStage(date)&&!/Dictée/.test(n))n+=' / Dictée';let parts=[`<div class="label">Semaine ${week+2} · ${w[0]}</div><h2>${new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</h2><p>${esc(n)}</p>`];let first=slots[0][0], last=slots.at(-1)[0];if(day===0||/Fluence/.test(n))parts.push(readingPanel());if(spellStage(date))parts.push(spellPanel());let activities=DATA.activities[date]||[];activities.forEach((a,i)=>parts.push(activityPanel(a,i)));if(DATA.phrase[date])parts.splice(3,0,`<div class="phrase"><strong>${DATA.phrase[date][0]}</strong><p>${DATA.phrase[date][1]}</p><p class="muted">Avec un adulte : explique cette phrase avec tes mots et donne un exemple.</p></div>`);if(DATA.photos&&DATA.photos[date])parts.push(renderPhotos(DATA.photos[date]));if(!activities.length && day>0 && !/Dictée/.test(n)){parts.push('<div class="note">Tu peux relire le texte de la semaine et t’entraîner à écrire quelques mots de dictée. À ton rythme !</div>')}$('#content').innerHTML=parts.join('');}
function readingPanel(){const weekIndex=week<5?week+1:0;let selector=week===5?`<label>Je choisis un texte étudié : <select id="textselect" onchange="readChoice=+this.value;refreshReading()">${DATA.titles.map((x,i)=>`<option value="${i}" ${readChoice===i?'selected':''}>${x}</option>`).join('')}</select></label>`:'';const ix=week===5?readChoice:weekIndex;return `<div class="item" id="readingSection"><h3>Fluence — ${week===5?'texte au choix':DATA.titles[ix]}</h3><p>Prends ton temps pour découvrir cette histoire, puis lis-la plusieurs fois à voix haute. Tu peux demander à un adulte de chronométrer une minute si tu en as envie.</p>${selector}<div id="readingBox">${readingContent(ix)}</div></div>`}
let fluencySelected=0, fluencyFinished=false;
function fluencyMarkup(text){return String(text).split(/(\s+)/).filter(Boolean).reduce((state,token)=>{if(/\s+/.test(token)){state.html+=token.replace(/\n/g,'<br>');return state}let n=++state.n;state.html+=`<span class="fluency-word" tabindex="0" role="button" data-word="${n}" onclick="selectFluencyWord(${n})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectFluencyWord(${n})}">${esc(token)}</span>${n%10===0?`<sup class="fluency-marker">${n}</sup>`:''}`;return state},{n:0,html:''}).html}
function selectFluencyWord(n){if(!fluencyFinished){$('#fluencyFeedback').textContent='Lis pendant une minute, puis choisis ton dernier mot.';return}fluencySelected=n;document.querySelectorAll('.fluency-word').forEach(e=>e.classList.toggle('selected',+e.dataset.word===n));updateFluencyResult()}
function updateFluencyResult(){let e=$('#fluencyErrors');if(!e||!fluencySelected)return;let errors=Number(e.value||0);let valid=Number.isInteger(errors)&&errors>=0&&errors<=fluencySelected;$('#fluencyFeedback').textContent=valid?`${fluencySelected} mots parcourus − ${errors} erreur(s) = ${fluencySelected-errors} mot(s) correctement lus en une minute.`:'Le nombre d’erreurs doit être compris entre 0 et '+fluencySelected+'.'}
function readingContent(ix){let q=DATA.questions[ix];return `<div class="label">${DATA.counts[ix]} mots · Texte intégral</div><div class="reading">${fluencyMarkup(DATA.texts[ix])}</div><div class="step"><strong>Chronomètre : </strong><span class="clock" id="clock">01:00</span> <button onclick="runClock()">Démarrer</button> <button class="secondary" onclick="resetClock()">Réinitialiser</button><div class="fluency-counts"><p><strong>Après la minute, clique sur le dernier mot que tu as lu.</strong> Les petits nombres t’aident à te repérer tous les 10 mots.</p><p>Erreurs relevées par un adulte (facultatif) : <input id="fluencyErrors" type="number" min="0" value="0" oninput="updateFluencyResult()"></p><p id="fluencyFeedback" role="status">Démarre le chronomètre avant de choisir un mot.</p></div></div><h3>Je comprends — 3 questions</h3>${q.map((x,i)=>`<fieldset class="q"><legend><strong>${i+1}. ${esc(x[0])}</strong></legend><details class="activity-help"><summary>💡 Besoin d’un coup de pouce ?</summary><p>Relis le passage du texte qui répond à cette question. Repère les mots importants avant de choisir.</p></details>${x[1].map((o,j)=>`<label><input type="radio" name="read${i}" value="${j}"> ${esc(o)}</label>`).join('')}<button type="button" class="secondary" onclick="checkReadingOne(${i})">Vérifier cette réponse</button><div id="rfeed${i}" role="status"></div></fieldset>`).join('')}`}
function refreshReading(){if(timer)clearInterval(timer);timer=null;sec=60;fluencySelected=0;fluencyFinished=false;$('#readingBox').innerHTML=readingContent(readChoice)}
function runClock(){if(timer)return;timer=setInterval(()=>{sec=Math.max(0,sec-1);let c=$('#clock');if(c)c.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(sec===0){clearInterval(timer);timer=null;fluencyFinished=true;let f=$('#fluencyFeedback');if(f)f.textContent='Temps terminé ! Clique maintenant sur ton dernier mot lu.'}},1000)}function resetClock(){if(timer)clearInterval(timer);timer=null;sec=60;fluencySelected=0;fluencyFinished=false;$('#clock').textContent='01:00';document.querySelectorAll('.fluency-word').forEach(e=>e.classList.remove('selected'));let f=$('#fluencyFeedback');if(f)f.textContent='Démarre le chronomètre avant de choisir un mot.'}
function checkReadingOne(i){
 const ix=week===5?readChoice:week+1,q=DATA.questions[ix][i];
 const chosen=document.querySelector(`input[name="read${i}"]:checked`),fb=document.getElementById('rfeed'+i);
 if(!fb||fb.dataset.complete)return;
 if(!chosen){fb.innerHTML='<div class="response bad">Choisis une réponse avant de vérifier.</div>';return;}
 if(fb.dataset.last===chosen.value){fb.innerHTML='<div class="response bad">Choisis une autre réponse pour ton deuxième essai.</div>';return;}
 fb.dataset.last=chosen.value;
 if(Number(chosen.value)===q[2]){fb.dataset.complete='yes';fb.innerHTML=`<div class="response good">Bravo ! ${esc(READ_EXPLANATIONS[ix][i])}</div>`;return;}
 const tries=Number(fb.dataset.tries||0)+1;fb.dataset.tries=tries;
 if(tries===1){fb.innerHTML='<div class="response bad">Relis le passage et cherche l’indice. Tu peux réessayer.</div>';}
 else{fb.dataset.complete='shown';fb.innerHTML=`<div class="response bad"><strong>Correction :</strong> ${esc(q[1][q[2]])}. ${esc(READ_EXPLANATIONS[ix][i])}</div>`;}
}

function normalizedExerciseAnswer(value){
  const str=String(value).normalize('NFC').replace(/[\u00a0\u202f]/g,' ').trim().toLocaleLowerCase('fr-FR');
  // Pour les nombres, accepter les espaces des milliers et le signe × ou x.
  if (/^[+−-]?[\d\s]+(?:[,.][\d\s]+)?$/.test(str)) return str.replace(/\s+/g,'').replace(',', '.').replace('−','-');
  // Pour les additions répétées et multiplications, ignorer les espaces autour des opérateurs.
  if (/^[\d\s]+(?:[+×x*][\d\s]+)+$/.test(str) && /[+×x*]/.test(str)) return str.replace(/\s+/g,'').replace(/[x*]/g,'×');

}

function mathReadinessPanel(p){
 const tasks=p.tasks;

 });

function checkMathStep(i){
 const taskIndexes=[1,2,5,6,7,8,9];
 const t=PREPARATIONS['2026-12-11'].tasks[taskIndexes[i]];
 const input=document.getElementById('mathAnswer'+i), feedback=document.getElementById('mathFeedback'+i);
 if(!input||!feedback||input.readOnly)return;
 const raw=input.value.trim();
 if(!raw){feedback.innerHTML='<p class="response bad">Écris d’abord ta réponse, puis vérifie.</p>';return;}
 const good=normalizedExerciseAnswer(raw)===normalizedExerciseAnswer(t[2]);
 if(!good && input.dataset.lastWrong===normalizedExerciseAnswer(raw)){
  feedback.innerHTML='<p class="response bad">Modifie ta réponse avant de vérifier à nouveau.</p>';return;
 }
 if(!good)input.dataset.lastWrong=normalizedExerciseAnswer(raw);
 const tries=Number(input.dataset.tries||0)+(good?0:1);
 input.dataset.tries=String(tries);
 if(!good&&tries===1){
  feedback.innerHTML='<p class="response bad">Pas tout à fait ! Ouvre « Besoin d’un coup de pouce ? », relis la méthode et essaie une deuxième fois.</p>';
  input.focus();return;
 }
 feedback.innerHTML=`<p class="response ${good?'good':'bad'}">${good?'Bravo ! Tu as trouvé la bonne réponse.':'Merci d’avoir essayé deux fois ! Voici comment faire.'}<span class="correction-note"> ${esc(t[3]||t[2])}</span></p>`;
 input.readOnly=true;
 const btn=input.parentElement.querySelector('button');if(btn)btn.disabled=true;
 const next=document.getElementById('mathStep'+(i+1));
 if(next){next.hidden=false;}else{const done=document.getElementById('mathDone');if(done)done.hidden=false;}
}

  if(!good&&el.dataset.last===attemptSignature){el.innerHTML='<p class="response bad">Modifie ta réponse avant ton deuxième essai.</p>';return;}

   el.innerHTML=`<p class="response good">${kind==='order'?'Bravo ! Tu as remis l’histoire dans le bon ordre !':kind==='long'?'Tu as écrit trois phrases. Relis-les avec la grille : racontent-elles une histoire dans l’ordre ?':'Bravo, belle réussite !'}</p>`;

   else if(kind==='q')corr.innerHTML=`<div class="answer-correction"><strong>Bonne réponse :</strong> ${esc(t[2][t[3]])}. ${esc(specificQcmExplanation(p.titre,t[1],t[2][t[3]]))}</div>`;

  }
 });
 const result=document.getElementById('prepResult');if(!result)return;

/main>\n<script>\n'use strict';\nconst LESSONS={doubling:'https://labastide11.github.io/Maitre-Hibou/bibliotheque_math/lecons/doubles-moitie.html',multiply:'https://labastide11.github.io/Maitre-Hibou/bibliotheque_math/lecons/multiplier-10-100.html',classes:'https://labastide11.github.io/Maitre-Hibou/bibliotheque_lecons/lecons/grammaire-classe-des-mots.html',digits:'https://labastide11.github.io/Maitre-Hibou/bibliotheque_math/lecons/valeur-position-chiffres.html',families:'https://labastide11.github.io/Maitre-Hibou/bibliotheque_lecons/lecons/vocabulaire-familles-prefixes-suffixes.html'};\nconst NATACHA=`Aujourd’hui, Natacha fait sa première rentrée dans une école où elle va être pensionnaire. Au début, elle se sent un peu seule car elle ne voit aucune tête connue.\n\nDevant tous ces yeux qui la dévisagent, Natacha rougit, pâlit, mais elle surmonte sa timidité. « Je finirai bien par faire des connaissances », se dit-elle. À ce moment, une jeune fille vient vers elle :\n\n– Bonjour, je m'appelle Patricia. Est-ce que tu es nouvelle ici ?\n– Oui, je viens d’arriver et je ne connais personne.\n– Je suis nouvelle aussi. Veux-tu être mon amie ?\n\nNatacha adresse un sourire à celle qui lui tend la main. Elle prend cette main et dit :\n– D'accord ! À deux, la vie sera plus facile et nous ferons du bon travail !`;\nconst SPELL=[{w:'école',meaning:'Lieu où les enfants apprennent.',nature:'Nom féminin : une école.',hint:'Attention à l’accent aigu sur é.'},{w:'classe',meaning:'Groupe d’élèves qui travaillent ensemble ; c’est aussi leur salle.',nature:'Nom féminin : une classe.',hint:'Deux s.'},{w:'village',meaning:'Petit ensemble de maisons où vivent des habitants.',nature:'Nom masculin : un village.',hint:'Deux l.'},{w:'ferme',meaning:'Lieu où l’on élève des animaux ou cultive des terres.',nature:'Nom féminin : une ferme.',hint:'Le e final ne s’entend pas.'},{w:'poule',meaning:'Oiseau élevé notamment pour ses œufs.',nature:'Nom féminin : une poule.',hint:'Le e final ne s’entend pas.'},{w:'cochon',meaning:'Animal de ferme à quatre pattes.',nature:'Nom masculin : un cochon.',hint:'Le son « ch » s’écrit avec deux lettres.'},{w:'campagne',meaning:'Endroit avec des champs, des fermes et des villages.',nature:'Nom féminin : la campagne.',hint:'Le groupe de lettres gn.'},{w:'chaque',meaning:'Signifie « chacun des éléments d’un groupe ».',nature:'Déterminant : chaque jour.',hint:'Le groupe ch et la fin que.'}];\nconst task={doubling:[['Double de 6',12],['Double de 8',16],['Double de 15',30],['Double de 25',50],['Moitié de 10',5],['Moitié de 20',10],['Moitié de 40',20]],multiply:[['7 × 10',70],['12 × 10',120],['4 × 100',400],['23 × 10',230]],digits:[['Dans 4 725, valeur du chiffre 7',700],['Dans 8 316, valeur du chiffre 8',8000],['Dans 2 409, valeur du chiffre 9',9]]};\nconst $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));let current='tuesday',currentDay='tuesday',timer=null,seconds=60,wordIndex=0,spellAttempts={};\nfunction link(k,label){return `<a class=\"resource\" target=\"_blank\" rel=\"noopener\" href=\"${LESSONS[k]}\">Lien vers la leçon &gt; ${label}</a>`}\nfunction numberForm(key){return `<div class=\"exercise\"><strong>J’écris chaque résultat, puis je vérifie.</strong>${task[key].map(([q,a],i)=>`<div class=\"question\"><label for=\"${key}${i}\">${q} =</label><details class=\"lesson\"><summary>💡 Besoin d’un coup de pouce ?</summary><p>${key==='doubling'?'Pour un double, additionne deux fois le même nombre. Pour une moitié, partage en deux parts égales.':'Pour multiplier par 10, ajoute un zéro à un nombre entier ; par 100, ajoute deux zéros.'}</p></details><input aria-label=\"${q}\" inputmode=\"numeric\" id=\"${key}${i}\" autocomplete=\"off\" type=\"text\" placeholder=\"Ma réponse\"/><button class=\"secondary\" onclick=\"checkNumber('${key}',${i},${a})\">Vérifier</button><div class=\"small\" id=\"${key}feedback${i}\" role=\"status\"></div></div>`).join('')}</div>`}\nfunction checkNumber(key,i,a){const field=$(`#${key}${i}`),el=$(`#${key}feedback${i}`),v=field.value.trim().replace(/\\s/g,''); if(!/^\\d+$/.test(v)){el.innerHTML='<div class=\"answer bad\">Écris un nombre avant de vérifier.</div>';return}const ok=Number(v)===a;if(!ok && field.dataset.lastWrong===v){el.innerHTML='<div class=\"answer bad\">Modifie ta réponse avant un nouvel essai.</div>';return;}if(!ok)field.dataset.lastWrong=v;field.dataset.tries=ok?'0':String(Number(field.dataset.tries||0)+1);const reveal=!ok&&Number(field.dataset.tries)>=2;el.innerHTML=`<div class=\"answer ${ok?'ok':'bad'}\">${ok?'Bravo, bonne réponse !':reveal?'Correction : '+a+'. Revois l’aide puis réessaie.':'Pas encore. Ouvre le coup de pouce et réessaie.'}</div>`;if(ok)field.readOnly=true}\nfunction render(section){clearInterval(timer);timer=null;seconds=60;current=section;if(['tuesday','thursday','friday'].includes(section))currentDay=section;document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));const root=$('#main');const view={\ntuesday:()=>`<span class=\"pill\">Mardi 3 novembre · environ 10 min</span><h2>Je lis et je calcule</h2><p>1. Lis tranquillement <strong>Natacha</strong> à voix haute. Tu peux relire un passage difficile.</p><button onclick=\"render('reading')\">Ouvrir le texte et le chronomètre</button><h3>2. J’écris les doubles et les moitiés</h3>${link('doubling','doubles et moitiés')}${numberForm('doubling')}<div class=\"callout\"><strong>Pour l’adulte :</strong> l’enfant lit à voix haute et écrit ses résultats lui-même. Il vérifie après chaque calcul.</div><h3>3. Dictée — premiers mots</h3><p>Découvre les quatre premiers mots de « Pierre et sa ferme ».</p><button onclick=\"render('spelling')\">Ouvrir ma dictée</button>`,\nthursday:()=>`<span class=\"pill\">Jeudi 5 novembre · environ 10 min</span><h2>Les noms et ×10 / ×100</h2><div class=\"lesson\"><strong>Ma trace écrite</strong><p>Un <strong>nom commun</strong> désigne une personne, un animal, une chose ou un lieu en général : <em>une école, un cochon</em>. Un <strong>nom propre</strong> désigne une personne ou un lieu particulier et commence par une majuscule : <em>Natacha, Carcassonne</em>.</p></div>${link('classes','Les classes de mots')}<div class=\"exercise\"><strong>Je lis les mots, puis je choisis un nom commun et un nom propre.</strong><details class=\"lesson\"><summary>💡 Besoin d’un coup de pouce ?</summary><p>Un nom propre commence par une majuscule et désigne un lieu ou une personne précis. Un nom commun désigne une chose, un animal ou un lieu en général.</p></details><p>Recopie deux mots de la banque, au bon endroit. Attention à la majuscule !</p><div class=\"lesson\"><strong>Banque de mots</strong><p style=\"font-size:1.15rem;line-height:2\">Paris · vélo · Léa · chat · Carcassonne · école</p></div><div class=\"question\"><label for=\"common\">Un nom commun</label><input id=\"common\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Je recopie un mot\"/></div><div class=\"question\"><label for=\"proper\">Un nom propre</label><input id=\"proper\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Je recopie un mot\"/></div><button class=\"secondary\" onclick=\"checkNouns()\">Vérifier mes deux réponses</button><div id=\"nounsFeedback\" role=\"status\"></div><p class=\"small muted\">Je peux regarder la leçon avant de répondre.</p></div><h3>Je calcule et j’écris les résultats</h3>${link('multiply','Multiplier par 10 ou 100')}${numberForm('multiply')}<h3>Dictée — Pierre et sa ferme</h3><p>Je découvre les mots, puis je les écris sans modèle.</p><button onclick=\"render('spelling')\">Ouvrir les mots et la dictée interactive</button>`,\nfriday:()=>`<span class=\"pill\">Vendredi 6 novembre · environ 8 min</span><h2>Valeur des chiffres et familles de mots</h2><div class=\"lesson\"><strong>Ma trace écrite</strong><p>Dans le nombre <strong>4 725</strong>, le chiffre 7 vaut <strong>700</strong> car il est à la place des centaines.</p></div>${link('digits','Valeur des chiffres')}${numberForm('digits')}<h3>Je cherche des mots de la même famille</h3><div class=\"lesson\">Les mots d’une même famille ont une partie commune et un sens proche. Exemple : <em>terre, terrestre, terrien</em>.</div>${link('families','Familles de mots')}<div class=\"exercise\"><strong>Je classe les mots de la même famille.</strong><p>Choisis dans la banque un mot de la famille de « chant » et un mot de la famille de « jardin ». Écris-les au bon endroit.</p><div class=\"lesson\"><strong>Banque de mots</strong><p style=\"font-size:1.1rem;line-height:2\">jardiner · chanson · chaise · jardinier · chanteur · jaune</p></div><div class=\"question\"><label for=\"fam1\">Un mot de la famille de « chant » :</label><input id=\"fam1\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"J’écris le mot choisi\"/></div><div class=\"question\"><label for=\"fam2\">Un mot de la famille de « jardin » :</label><input id=\"fam2\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"J’écris le mot choisi\"/></div><button class=\"secondary\" onclick=\"verifyFamily()\">Vérifier mes deux réponses</button><div id=\"familyFeedback\" role=\"status\"></div></div>`,\nreading:()=>`<button class=\"secondary back-day\" onclick=\"render(currentDay)\">← Retour aux devoirs du jour</button><span class=\"pill\">Fluence · semaine 1 · texte intégral</span><h2>Natacha</h2><p class=\"muted\">125 mots selon la fiche de fluence fournie. Je lis clairement et je respecte la ponctuation.</p><div class=\"lesson\"><strong>Gamme de mots</strong><p>sa rentrée · première · une pensionnaire · elle rougit · elle surmonte · des connaissances · sa timidité · bonjour · personne · un sourire · cette main · d’accord · facile · nous ferons · je m’appelle · une tête · elle pâlit</p><p class=\"small\"><strong>Pensionnaire :</strong> élève qui vit dans son établissement scolaire pendant une partie de la semaine.</p></div><div class=\"reading\">${fluenceWordsWeek1(NATACHA)}</div><h3>Mon entraînement de fluence</h3><p>Une personne peut chronométrer ma lecture. Je compte les mots correctement lus en une minute.</p><div class=\"exercise\"><div class=\"controls\"><span id=\"clock\" class=\"clock\">01:00</span><button onclick=\"startClock()\">Démarrer 1 min</button><button class=\"secondary\" onclick=\"resetClock()\">Recommencer</button></div><div class=\"fluency-counts\"><p><strong>Après une minute, clique sur le dernier mot que tu as lu.</strong> Un repère est placé tous les 10 mots.</p><label>Erreurs relevées par un adulte (facultatif) : <input id=\"fluencyErrors\" type=\"number\" min=\"0\" value=\"0\" oninput=\"updateFluenceWeek1()\" /></label><div id=\"fluencyFeedback\" role=\"status\">Démarre le chronomètre pour commencer.</div></div></div><h3>Je comprends</h3><div class=\"exercise\"><p>Tu peux relire le texte autant que tu veux. Choisis une réponse à chaque question puis vérifie.</p><div class=\"reading-quiz\" id=\"readingQuiz\">\n<fieldset><legend><strong>1. À quel moment se passe l’histoire ?</strong></legend><details><summary>💡 Besoin d’un coup de pouce ?</summary><p>Relis le début du texte : quel événement Natacha vit-elle ?</p></details><label><input type=\"radio\" name=\"rq1\" value=\"a\"> Pendant les vacances</label><label><input type=\"radio\" name=\"rq1\" value=\"b\"> Le jour de la rentrée</label><label><input type=\"radio\" name=\"rq1\" value=\"c\"> À la fin de l’année scolaire</label><button type=\"button\" class=\"secondary\" onclick=\"checkReadingQuizOne(0)\">Vérifier cette réponse</button><div id=\"rqfeedback1\" role=\"status\"></div></fieldset>\n<fieldset><legend><strong>2. Pourquoi Natacha se sent-elle seule ?</strong></legend><details><summary>💡 Besoin d’un coup de pouce ?</summary><p>Relis les phrases qui expliquent ce que Natacha ressent dans sa nouvelle école.</p></details><label><input type=\"radio\" name=\"rq2\" value=\"a\"> Elle ne connaît personne.</label><label><input type=\"radio\" name=\"rq2\" value=\"b\"> Elle a perdu son cartable.</label><label><input type=\"radio\" name=\"rq2\" value=\"c\"> Elle s’est disputée avec Patricia.</label><button type=\"button\" class=\"secondary\" onclick=\"checkReadingQuizOne(1)\">Vérifier cette réponse</button><div id=\"rqfeedback2\" role=\"status\"></div></fieldset>\n<fieldset><legend><strong>3. Que propose Patricia à Natacha ?</strong></legend><details><summary>💡 Besoin d’un coup de pouce ?</summary><p>Retrouve la conversation entre Patricia et Natacha.</p></details><label><input type=\"radio\" name=\"rq3\" value=\"a\"> De travailler seule</label><label><input type=\"radio\" name=\"rq3\" value=\"b\"> De retourner chez elle</label><label><input type=\"radio\" name=\"rq3\" value=\"c\"> De devenir son amie</label><button type=\"button\" class=\"secondary\" onclick=\"checkReadingQuizOne(2)\">Vérifier cette réponse</button><div id=\"rqfeedback3\" role=\"status\"></div></fieldset>\n</div><div id=\"readingFeedback\" role=\"status\" aria-live=\"polite\"></div></div>`,\nspelling:()=>`<button class=\"secondary back-day\" onclick=\"render(currentDay)\">← Retour aux devoirs du jour</button><span class=\"pill\">Dictée · semaine 1 · ${currentDay==='tuesday'?'Palier 1':'Palier 2'}</span><h2>Pierre et sa ferme</h2><p>${currentDay==='tuesday'?'Je découvre les 4 premiers mots.':'Je retrouve les premiers mots et découvre les 4 suivants.'} Observe les mots du jour puis écris-les sans modèle.</p><div class=\"word-list\" id=\"spellingWords\">${SPELL.slice(0,week1Limit()).map(x=>`<span>${escapeHTML(x.w)}</span>`).join('')}</div><div class=\"tabbar\"><button id=\"studyMode\" class=\"on\" onclick=\"spellMode('study')\">1. Je découvre</button><button id=\"testMode\" class=\"secondary\" onclick=\"spellMode('test')\">2. J'écris sans modèle</button></div><div id=\"spellBody\"></div><div id=\"spellHistory\"></div><div class=\"callout\"><strong>Pour l’adulte :</strong> on ne découvre que les mots du palier prévu. La première réponse écrite est conservée, même lorsqu'elle comporte une erreur.</div>`\n};root.innerHTML=view[section]();if(section==='spelling'){wordIndex=0;spellMode('study')}}\nfunction checkNouns(){const a=$('#common').value.trim(),b=$('#proper').value.trim();const common=['vélo','chat','école'],proper=['Paris','Léa','Carcassonne'];const okA=common.includes(a),okB=proper.includes(b);const fb=$('#nounsFeedback');if(!a||!b){fb.innerHTML='<div class=\"answer bad\">Écris les deux mots avant de vérifier.</div>';return;}if(okA&&okB){fb.innerHTML='<div class=\"answer ok\">Bravo ! Les deux mots sont bien classés et bien écrits.</div>';return;}fb.innerHTML='<div class=\"answer bad\">'+(!okA?'Vérifie ton nom commun : c’est un mot qui désigne une chose, un animal ou un lieu en général. ':'')+(!okB?'Vérifie ton nom propre : il désigne un lieu ou une personne en particulier et commence par une majuscule.':'')+'</div>'; }\nfunction verifyFamily(){const a=$('#fam1').value.trim().toLocaleLowerCase('fr'),b=$('#fam2').value.trim().toLocaleLowerCase('fr');const okA=['chanson','chanteur'].includes(a),okB=['jardiner','jardinier'].includes(b);let feedback;if(!a||!b){feedback='<div class=\"answer bad\">Écris les deux mots avant de vérifier.</div>';}else if(okA&&okB){feedback='<div class=\"answer ok\">Bravo ! Tu as choisi et correctement écrit deux mots de la bonne famille.</div>';}else{feedback='<div class=\"answer bad\">'+(!okA?'Pour « chant », cherche un mot lié à la musique ou à la voix. ':'')+(!okB?'Pour « jardin », cherche un mot lié à l’activité ou à la personne qui s’occupe d’un jardin.':'')+' Relis la banque et réessaie.</div>';}$('#familyFeedback').innerHTML=feedback;}\nlet fluencyFinishedW1=false,fluencySelectedW1=0;\nfunction fluenceWordsWeek1(text){let n=0;return String(text).split(/(\\s+)/).map(t=>{if(/^\\s+$/.test(t))return t.replace(/\\n/g,'<br>');n++;return `<span class=\"fluency-word\" role=\"button\" tabindex=\"0\" data-word=\"${n}\" onclick=\"chooseFluenceWeek1(${n})\" onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();chooseFluenceWeek1(${n})}\">${escapeHTML(t)}</span>${n%10===0?`<sup class=\"fluency-marker\">${n}</sup>`:''}`}).join('')}\nfunction chooseFluenceWeek1(n){let f=$('#fluencyFeedback');if(!fluencyFinishedW1){if(f)f.textContent='Attends la fin de la minute avant de choisir ton dernier mot.';return}fluencySelectedW1=n;document.querySelectorAll('.fluency-word').forEach(e=>e.classList.toggle('selected',+e.dataset.word===n));updateFluenceWeek1()}\nfunction updateFluenceWeek1(){let f=$('#fluencyFeedback'),e=$('#fluencyErrors');if(!f||!e||!fluencySelectedW1)return;let v=Number(e.value||0);f.textContent=Number.isInteger(v)&&v>=0&&v<=fluencySelectedW1?`${fluencySelectedW1} mots parcourus − ${v} erreur(s) = ${fluencySelectedW1-v} mot(s) correctement lus en une minute.`:'Le nombre d’erreurs doit être compris entre 0 et '+fluencySelectedW1+'.'}\nfunction startClock(){if(timer)return;timer=setInterval(()=>{seconds--;$('#clock').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0){clearInterval(timer);timer=null;$('#clock').textContent='Terminé !';fluencyFinishedW1=true;let f=$('#fluencyFeedback');if(f)f.textContent='Temps terminé ! Clique sur ton dernier mot lu.'}},1000)}function resetClock(){clearInterval(timer);timer=null;seconds=60;fluencyFinishedW1=false;fluencySelectedW1=0;$('#clock').textContent='01:00';document.querySelectorAll('.fluency-word').forEach(e=>e.classList.remove('selected'));let f=$('#fluencyFeedback');if(f)f.textContent='Démarre le chronomètre pour commencer.'}\nfunction recordReading(){let n=Number($('#fluencyCount').value);$('#fluencyFeedback').innerHTML=`<div class=\"answer ${n>=0&&n<=125&&$('#fluencyCount').value.trim()?'ok':'bad'}\">${n>=0&&n<=125&&$('#fluencyCount').value.trim()?`Lecture notée : ${n} mot(s) correctement lus en une minute. Essaie à nouveau un autre jour.`:'Indique un nombre entre 0 et 125.'}</div>`}function checkReadingQuizOne(i){\n const keys=['b','a','c'], explanations=['La scène se passe le jour de la rentrée.','Natacha ne connaît personne dans sa nouvelle école.','Patricia propose à Natacha de devenir son amie.'];\n const chosen=document.querySelector(`input[name=\"rq${i+1}\"]:checked`),fb=document.getElementById('rqfeedback'+(i+1));\n if(!fb||fb.dataset.complete)return;\n if(!chosen){fb.innerHTML='<div class=\"answer bad\">Choisis une réponse avant de vérifier.</div>';return;}\n if(fb.dataset.last===chosen.value){fb.innerHTML='<div class=\"answer bad\">Change ta réponse avant de réessayer.</div>';return;}\n fb.dataset.last=chosen.value;\n if(chosen.value===keys[i]){fb.dataset.complete='yes';fb.innerHTML='<div class=\"answer ok\">Bravo ! '+explanations[i]+'</div>';return;}\n const tries=Number(fb.dataset.tries||0)+1;fb.dataset.tries=tries;\n if(tries===1){fb.innerHTML='<div class=\"answer bad\">Relis le passage et essaie encore.</div>';}\n else{fb.dataset.complete='shown';const options=[...document.querySelectorAll(`input[name=\"rq${i+1}\"]`)];const label=options.find(e=>e.value===keys[i])?.parentElement?.textContent?.trim()||'';fb.innerHTML='<div class=\"answer bad\"><strong>Correction :</strong> '+label+'. '+explanations[i]+'</div>';}\n}\n// Ancienne correction groupée de lecture retirée.\nlet spellModeVal='study';\nfunction week1Limit(){return currentDay==='tuesday'?4:8}\nfunction spellKey(){return currentDay==='tuesday'?'palier1':'palier2'}\nfunction spellMode(mode){spellModeVal=mode;$('#spellingWords').classList.toggle('hidden',mode==='test');$('#studyMode').className=mode==='study'?'on':'secondary';$('#testMode').className=mode==='test'?'on':'secondary';drawSpell()}\nfunction spellRows(){let a=spellAttempts[spellKey()]||{};let rows=Object.keys(a).sort((x,y)=>+x-+y).map(k=>{let t=a[k];return `<tr><td>${+k+1}</td><td>${escapeHTML(t.written)}</td><td>${escapeHTML(SPELL[k].w)}</td></tr>`}).join('');$('#spellHistory').innerHTML=`<div class=\"exercise\"><h3>Mes mots écrits</h3><div style=\"overflow:auto\"><table style=\"width:100%;border-collapse:collapse;text-align:left\"><thead><tr><th>Mot</th><th>Ce que j'ai écrit</th><th>La bonne réponse</th></tr></thead><tbody>${rows||'<tr><td colspan=\"3\">Le tableau se remplit après chaque vérification.</td></tr>'}</tbody></table></div></div>`}\nfunction drawSpell(){let limit=week1Limit();if(wordIndex>=limit)wordIndex=0;let x=SPELL[wordIndex],tries=spellAttempts[spellKey()]||{},attempt=tries[wordIndex];$('#spellBody').innerHTML=spellModeVal==='study'?`<div class=\"exercise\"><span class=\"pill\">Mot ${wordIndex+1}/${limit}</span><h3 style=\"font-size:28px\">${escapeHTML(x.w)}</h3><p><strong>Le sens :</strong> ${escapeHTML(x.meaning)}</p><p><strong>Sa nature :</strong> ${escapeHTML(x.nature)}</p><p><strong>J’observe :</strong> ${escapeHTML(x.hint)}</p><p>Lis le mot à voix haute. Regarde bien ses lettres.</p><div class=\"controls\"><button onclick=\"spellMode('test')\">J’essaie sans modèle</button></div></div>`:`<div class=\"exercise\"><span class=\"pill\">Mot ${wordIndex+1}/${limit} · modèle caché</span><p>Écoute le mot puis écris-le sans regarder.</p><div class=\"controls\"><button class=\"secondary\" onclick=\"speakWord()\">🔊 Écouter le mot</button></div><div class=\"question\"><label for=\"spellingInput\">J’écris le mot :</label><input id=\"spellingInput\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"Écris ici\" ${attempt?'readonly':''} value=\"${attempt?escapeHTML(attempt.written):''}\"/><button onclick=\"checkSpelling()\" ${attempt?'disabled':''}>Vérifier mon mot</button><div id=\"spellingFeedback\" role=\"status\">${attempt?`<div class=\"answer ${attempt.correct?'ok':'bad'}\">${attempt.correct?'Bravo, belle réussite !':'Regarde la bonne réponse dans le tableau.'}</div>`:''}${attempt?`<div class=\"question\"><label for=\"week1Rewrite\">Je réécris le mot correctement (facultatif) :</label><input id=\"week1Rewrite\" spellcheck=\"false\" autocomplete=\"off\" placeholder=\"Je cache le modèle et je réécris\"><button class=\"secondary\" onclick=\"checkWeek1Rewrite()\">Vérifier ma réécriture</button><div id=\"week1RewriteFeedback\" role=\"status\"></div></div>`:''}</div></div>${wordIndex<limit-1?`<div class=\"controls\"><button class=\"secondary\" id=\"nextSpelling\" onclick=\"nextWord()\" ${attempt?'':'disabled'}>Mot suivant</button></div>`:'<p>Tu as atteint le dernier mot du palier.</p>'}</div>`;spellRows()}\nfunction nextWord(){if(spellModeVal==='test' && !(spellAttempts[spellKey()]||{})[wordIndex])return;wordIndex=Math.min(week1Limit()-1,wordIndex+1);drawSpell()}\nfunction speakWord(){if(!('speechSynthesis' in window)){alert('Un adulte peut te dicter le mot.');return}speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(SPELL[wordIndex].w);utter.lang='fr-FR';utter.rate=.75;speechSynthesis.speak(utter)}\nfunction checkWeek1Rewrite(){\n const input=document.getElementById('week1Rewrite'),out=document.getElementById('week1RewriteFeedback');if(!input||!out)return;\n const v=input.value.trim();if(!v){out.innerHTML='<div class=\"answer bad\">Écris le mot pour vérifier.</div>';return;}\n const expected=SPELL[wordIndex].w;\n const ok=v.normalize('NFC').toLocaleLowerCase('fr-FR')===expected.normalize('NFC').toLocaleLowerCase('fr-FR');\n out.innerHTML=ok?'<div class=\"answer ok\">Bravo, tu as bien réécrit le mot !</div>':'<div class=\"answer bad\">Relis le mot du tableau et essaie encore.</div>';\n if(ok)input.readOnly=true;\n}\nfunction checkSpelling(){let f=$('#spellingInput');if(!f)return;let written=f.value.trim();if(!written){$('#spellingFeedback').innerHTML='<div class=\"answer bad\">Écris d’abord le mot.</div>';return}let wanted=SPELL[wordIndex].w;let tries=spellAttempts[spellKey()]||(spellAttempts[spellKey()]={});if(tries[wordIndex])return;let correct=written.normalize('NFC').toLocaleLowerCase('fr-FR')===wanted.normalize('NFC').toLocaleLowerCase('fr-FR');tries[wordIndex]={written,correct};drawSpell()}\ndocument.querySelectorAll('.menu button[data-section]').forEach(button => {\n  button.addEventListener('click', () => render(button.dataset.section));\n});\nrender('tuesday');\n<\/script></body></html>\n";

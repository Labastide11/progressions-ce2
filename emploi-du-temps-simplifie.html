<style>

  @media(min-width:1500px){.simple-wrap{width:calc(100% - 34px)}.simple-row{grid-template-columns:minmax(260px,23%) minmax(0,1fr)}.simple-subject,.simple-activity{padding-top:16px;padding-bottom:16px}}
  @media(max-width:780px){.site-nav{position:static}.simple-wrap{width:calc(100% - 16px);margin-top:8px}.simple-head{padding:12px}.simple-row{grid-template-columns:1fr}.simple-subject{padding:10px 13px;font-size:19px}.simple-activity{padding:10px 15px 13px}.subject-picto{width:36px;height:36px;flex-basis:36px;font-size:22px}.activity-name{font-size:20px}.learning-line{font-size:18px}.learning-extra{font-size:16px}}

  /* Étiquettes visuelles Maître Hibou — repérage immédiat pour lecteurs fragiles. */
  .simple-subject{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 14px;min-width:0}

  @media(max-width:780px){.simple-subject{align-items:flex-start;padding:8px 12px}.subject-banner{max-width:220px;max-height:75px}.subject-banner-set{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}.subject-banner-set .subject-banner{max-width:min(43%,185px);max-height:70px}}

    display:block;width:auto;max-width:100%;height:76px;object-fit:contain;
  }

  @media print{.simple-pause-strip{break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>

<script>
(function(){
'use strict';
var MONTHS={janvier:0,février:1,fevrier:1,mars:2,avril:3,mai:4,juin:5,juillet:6,août:7,aout:7,septembre:8,octobre:9,novembre:10,décembre:11,decembre:11};
function norm(s){return String(s||'').trim().toLowerCase();}
function parseDayLabel(label){var m=String(label||'').match(/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi|Samedi|Dimanche)\s+(\d{1,2})(?:er)?\s+([A-Za-zÀ-ÿ]+)\s+(\d{4})$/i);if(!m)return null;var n=MONTHS[norm(m[3])];return typeof n==='number'?new Date(+m[4],n,+m[2],12):null;}
function isoDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function collectDays(){var result=[],data=window.PROGRESSIONS_EDT_DATA||{};Object.keys(data).forEach(function(key){if(!/DetailedWeeks$/i.test(key)||!Array.isArray(data[key]))return;data[key].forEach(function(w){if(!w||!Array.isArray(w.days))return;w.days.forEach(function(day){if(!Array.isArray(day)||!Array.isArray(day[1]))return;var date=parseDayLabel(day[0]);if(date)result.push({date:date,label:day[0],weekTitle:w.title||w.dates||'',rows:day[1]});});});});var map=new Map();result.sort(function(a,b){return a.date-b.date});result.forEach(function(d){var key=isoDate(d.date),old=map.get(key);if(!old||d.rows.length>old.rows.length)map.set(key,d);});return Array.from(map.values()).sort(function(a,b){return a.date-b.date});}
function plain(html){var t=document.createElement('div');t.innerHTML=String(html||'');return (t.textContent||'').replace(/\s+/g,' ').trim();}
function short(s,max){s=String(s||'').replace(/\s+/g,' ').replace(/\s+[.;:]$/,'').trim();if(s.length<=max)return s;var x=s.slice(0,max+1);return x.slice(0,x.lastIndexOf(' '))+'…';}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function kindFor(row){var k=String(row[4]||'').toLowerCase(),s=norm(row[1]);if(/récréation|pause/.test(s)||k==='break')return 'break';if(['french','maths','english','eps','arts','history','science','emc','common'].indexOf(k)>=0)return k;if(/français|lecture|dictée|production d’écrits/.test(s))return 'french';if(/math/.test(s))return 'maths';if(/anglais/.test(s))return 'english';if(/sciences/.test(s))return 'science';if(/histoire/.test(s))return 'history';if(/géographie/.test(s))return 'history';if(/eps/.test(s))return 'eps';return 'common';}
function picto(s,k){s=norm(s);if(k==='break')return '🛝';if(/lecture|fluence/.test(s))return '📖';if(/dictée|orthographe/.test(s))return '✍️';if(/production d.?écrits|écrivain|copie/.test(s))return '🖊️';if(/calcul mental/.test(s))return '🧠';if(/géométr/.test(s))return '📐';if(/numération|nombre/.test(s))return '🔢';if(/problème/.test(s))return '🧩';if(/anglais/.test(s))return '🇬🇧';if(/eps|sport|endurance/.test(s))return '🏃';if(/musique|chant|chorale/.test(s))return '🎵';if(/arts/.test(s))return '🎨';if(/sciences/.test(s))return '🔬';if(/géographie/.test(s))return '🌍';if(/histoire/.test(s))return '⏳';if(/emc|vie de classe/.test(s))return '🤝';if(k==='maths')return '➗';if(k==='french')return '📘';return '📌';}
function subjectName(s,k){s=String(s||'');if(k==='break')return /récréation/i.test(s)?'Récréation':'Pause';if(/anglais/i.test(s))return 'Anglais';if(/mathématiques|calcul mental/i.test(s))return 'Mathématiques';if(/sciences/i.test(s))return 'Sciences';if(/histoire/i.test(s))return 'Histoire';if(/géographie/i.test(s))return 'Géographie';if(/EPS|course longue|endurance|sport/i.test(s))return 'EPS';if(/CHAM|arts|musique|chant/i.test(s))return 'Arts et musique';if(/EMC/i.test(s)&&!/français/i.test(s))return 'EMC';if(/français|lecture|dictée|orthographe|production d’écrits|quart d’heure/i.test(s))return 'Français';return s.split(/[—–]/)[0].trim()||'Notre activité';}
// On ne copie JAMAIS row[2] dans le HTML : il contient les instructions du maître.
function subjectTopic(row){var s=String(row[1]||''),body=plain(row[2]),m=s.match(/[—–]\s*(.*)$/);if(/dictée flash\s*3/i.test(s))return 'Dictée flash 3 et phrase du jour';if(/dictée bilan/i.test(s))return 'Dictée bilan';if(/dictée flash\s*2/i.test(s))return 'Dictée flash 2';if(/dictée|orthographe/i.test(s))return 'Les mots et la dictée';if(/quart d.?heure de lecture/i.test(s))return 'Lecture plaisir';if(/CHAM/i.test(s))return 'Chorale et ateliers';if(/retour au calme/i.test(s))return 'Retour au calme';if(m&&m[1].trim())return short(m[1].trim(),65);if(/^(?:Français|Mathématiques|Sciences|Histoire|Anglais|EMC)$/i.test(s.trim())&&body&&!/<[a-z]/i.test(String(row[2]||''))){return short(body.split(/[.:;]/)[0],68);}if(/Français\s*\/\s*EMI/i.test(s))return 'Je cherche des informations';if(/Arts plastiques/i.test(s))return 'Création artistique';return short(s,60);}
function skill(row){var t=String(row[3]||'');if(t.indexOf('·')>=0)t=t.split('·').slice(1).join('·');else t='';t=t.replace(/^[\s–—:;]+/,'').replace(/[.;]+$/,'').trim();if(/^[A-Z]{2,6}-P\d|compétences déjà enseignées|^réinvestissement$/i.test(t))return '';return t;}
function fromTeacherObjective(row){var container=document.createElement('div');container.innerHTML=String(row[2]||'');var els=Array.from(container.querySelectorAll('div,p,li'));for(var i=0;i<els.length;i++){var el=els[i],val=(el.textContent||'').replace(/\s+/g,' ').trim();if(el.children.length>3||val.length>240)continue;var m=val.match(/Compétence (?:travaillée|du jour)\s*:\s*(.*)/i);if(m){var x=m[1].replace(/^Aujourd'hui,?\s*nous allons apprendre à\s*/i,'').replace(/^Aujourd’hui,?\s*nous allons apprendre à\s*/i,'').replace(/^Aujourd'hui,?\s*nous allons\s*/i,'').replace(/^Aujourd’hui,?\s*nous allons\s*/i,'');return x.replace(/[.;]+$/,'').trim();}}return '';}
function naturalObjective(source){var x=String(source||'').trim().replace(/\s+/g,' ').replace(/[.!]+$/,'');if(!x)return '';if(/^(Aujourd|Tu |Nous |Je )/i.test(x))return short(x,145).replace(/^(Aujourd'hui,?\s*nous allons|Aujourd’hui,?\s*nous allons)/i,'Aujourd’hui, tu vas');if(/^(Reconnaître|Comprendre|Identifier|Calculer|Multiplier|Placer|Ranger|Comparer|Lire|Écrire|Repérer|Observer|Décrire|Réutiliser|Mémoriser|Associer|Formuler|Produire|Transformer|Accorder|Utiliser|Demander|Dire|Maintenir|Expliquer|Résoudre|Présenter|Reformuler|Découvrir|Courir|Gérer|Respecter|Coopérer|Travailler|Consolider|Réinvestir|Améliorer|Trouver|Écouter|Distinguer|Ordonner|Classer|Inventer|Savoir|Choisir|Raconter|Construire|Décomposer|Effectuer|Faire|S'exprimer)/i.test(x)){return 'Tu vas apprendre à '+short(x.charAt(0).toLowerCase()+x.slice(1),127)+'.';}return '';}
function objective(row,topic){var s=norm(row[1]),c=String(row[3]||'');if(/récréation|pause/.test(s))return 'Tu prends une pause avant de poursuivre les apprentissages.';if(/quart d.?heure de lecture/.test(s))return 'Tu prends plaisir à lire et tu t’entraînes à lire régulièrement.';if(/calcul mental/.test(s)){var r=skill(row);if(/doubles? et moitiés/i.test(r))return 'Tu vas améliorer ta connaissance des doubles et des moitiés.';if(/multiplier.*10/i.test(r))return 'Tu vas apprendre à multiplier rapidement un nombre par 10.';}
if(/dictée/i.test(s)){if(/bilan/i.test(s))return 'Tu vas réutiliser les mots appris cette semaine dans une dictée.';if(/flash/i.test(s))return 'Tu vas écrire une phrase dictée en utilisant les mots que tu as appris.';return 'Tu vas mémoriser et écrire correctement les mots de la semaine.';}
if(/course longue|endurance/.test(s))return 'Tu vas apprendre à courir longtemps à ton rythme.';
if(/CHAM/.test(s))return 'Tu vas pratiquer le chant, les arts ou la lecture avec ton groupe.';
if(/retour au calme/.test(s))return 'Tu vas récupérer après l’effort et expliquer ce que tu as réussi.';
var sk=skill(row);var from=naturalObjective(sk);if(from)return from;
from=naturalObjective(fromTeacherObjective(row));if(from)return from;
if(/lecture/.test(s)||/lire/i.test(topic))return 'Tu vas t’entraîner à lire et à mieux comprendre les textes.';
if(/anglais/.test(s))return 'Tu vas apprendre à comprendre et à dire de nouveaux mots en anglais.';
if(/math/.test(s))return 'Tu vas t’entraîner à utiliser les nombres pour réfléchir et calculer.';
if(/arts|musique/.test(s))return 'Tu vas créer et expliquer tes choix.';
if(/eps/.test(s))return 'Tu vas apprendre à bouger, à coopérer et à gérer ton effort.';
return 'Tu vas découvrir une nouvelle idée et t’entraîner à l’utiliser.';}
// La sélection se fonde sur l'activité de la séance, sans afficher les consignes du maître.
var labelText={'francais':'Français','dictee':'Dictée','production-ecrits':'Production d’écrits','calcul-mental':'Calcul mental','lecture-plaisir':'Lecture plaisir','piscine':'Piscine','chant':'Chant','anglais':'Anglais','decouverte-monde':'Découverte du monde','mathematiques':'Mathématiques','lecture-comprehension':'Lecture / Compréhension','sciences':'Sciences','histoire':'Histoire','geographie':'Géographie','emc':'EMC','arts-visuels':'Arts visuels','recreation':'Récréation','calcul-pose':'Calcul posé','problemes':'Problèmes','geometrie':'Géométrie','copie':'Copie'};
function imagesFor(row,kind){
  var subject=String(row[1]||'').toLowerCase(),topic=subjectTopic(row).toLowerCase();
  var value=subject+' '+topic,details=plain(row[2]);
  if(/récréation/.test(value))return ['recreation'];
  if(/pause|cantine|repas/.test(value))return [];
  if(/piscine|natation|aquatique|bassin/.test(value))return ['piscine'];
  if(/dictée/.test(value)&&/production d.?écrits|dras|phrase du jour/.test(value))return ['dictee','production-ecrits'];
  if(/dictée|orthographe|mots de la semaine/.test(value))return ['dictee'];
  if(/production d.?écrits|dras|écrivain/.test(value))return ['production-ecrits'];
  if(/copie|recopier/.test(value))return ['copie'];
  if(/quart d.?heure de lecture|lecture plaisir|lecture offerte|lecture autonome/.test(value))return ['lecture-plaisir'];
  if(/lecture|compréhension|fluence|texte et illustration|récit|lire/.test(value))return ['lecture-comprehension'];
  if(/calcul mental|doubles|moitiés/.test(value))return ['calcul-mental'];
  if(/calcul posé|calculs posés|addition posée|soustraction posée/.test(value))return ['calcul-pose'];
  if(/problème/.test(value))return ['problemes'];
  if(/géométr|polygone|figure géométrique|droite graduée/.test(value))return ['geometrie'];
  if(/anglais/.test(value)||kind==='english')return ['anglais'];
  if(/chant|chorale|musique|cham/.test(value)||kind==='cham')return ['chant'];
  if(/géographie|repères france|carte de france/.test(value))return ['geographie'];
  if(/histoire/.test(value))return ['histoire'];
  if(/sciences|expérience|états de l.eau/.test(value)||kind==='science')return ['sciences'];
  if(/découverte du monde|questionner le monde|\bqlm\b/.test(value))return ['decouverte-monde'];
  if(/arts visuels|arts plastiques|dessin|création artistique/.test(value)||kind==='arts')return ['arts-visuels'];
  if(/emc|message clair|vivre ensemble|vie de classe/.test(value)||kind==='emc')return ['emc'];
  if(/course longue|endurance|eps|sport/.test(value)||kind==='eps')return [];
  if(/mathématiques|numération|nombres|calcul/.test(value)||kind==='maths')return ['mathematiques'];
  if(/français|grammaire|conjugaison|vocabulaire|orthographe/.test(value)||kind==='french')return ['francais'];
  return [];
}
function learningBlock(title,goal){var a=document.createElement('div');a.className='micro-activity';var h=document.createElement('h2');h.className='activity-name';h.textContent=title;var p=document.createElement('p');p.className='learning-line';var lead=document.createElement('span');lead.className='learning-lead';lead.textContent='Ce que j’apprends : ';p.appendChild(lead);p.appendChild(document.createTextNode(goal));a.appendChild(h);a.appendChild(p);return a;}
function learningContent(row){var a=document.createElement('div');a.className='micro-activities';var s=String(row[1]||'');if(/dictée flash\s*3/i.test(s)&&/production d.?écrits|DRAS/i.test(s)){a.classList.add('dual');a.appendChild(learningBlock('Dictée flash 3','Tu vas écrire correctement les mots appris dans une phrase.'));a.appendChild(learningBlock('Phrase du jour — DRAS','Tu vas transformer une phrase pour la rendre plus précise.'));}
else if(/dictée bilan/i.test(s)&&/production d.?écrits|DRAS/i.test(s)){a.classList.add('dual');a.appendChild(learningBlock('Dictée bilan','Tu vas réutiliser les mots de la semaine dans une dictée.'));a.appendChild(learningBlock('Production d’écrits','Tu vas écrire quelques phrases et les relire pour les améliorer.'));}
else {var title=subjectTopic(row);a.appendChild(learningBlock(title,objective(row,title)));}return a;}
var days=collectDays(),currentIndex=0;
function nearestIndexToToday(){if(!days.length)return 0;var now=new Date();now.setHours(12,0,0,0);var exact=days.findIndex(function(x){return isoDate(x.date)===isoDate(now)});if(exact>=0)return exact;var next=days.findIndex(function(x){return x.date>now});return next>=0?next:days.length-1;}
function timeRange(row){
  var raw=String(row[0]||'').replace(/\s+/g,'').replace(/[–—−]/g,'-');
  var parts=raw.split('-');
  function minutes(p){var m=String(p||'').match(/^(\d{1,2})h(\d{0,2})$/i);return m?(+m[1]*60+ +(m[2]||0)):null;}
  return {start:minutes(parts[0]),end:minutes(parts[1])};
}
function pauseTypeFromRow(row){
  var s=norm(row[1]);
  if(/récréation|recreation/.test(s)){
    var slot=timeRange(row);return slot.start!==null&&slot.start>=13*60?'recreation-apres-midi':'recreation-matin';
  }
  if(/cantine|repas|pause méridienne|pause du midi|déjeuner|dejeuner/.test(s))return 'pause-midi-cantine-maison';
  return '';
}
function pauseStrip(type){
  var alt={'recreation-matin':'Récréation du matin','recreation-apres-midi':'Récréation de l’après-midi','pause-midi-cantine-maison':'Cantine ou repas à la maison'};
  var bar=document.createElement('div');bar.className='simple-pause-strip';bar.setAttribute('role','group');bar.setAttribute('aria-label',alt[type]);
  var image=document.createElement('img');image.src='images/edt-etiquettes/'+type+'.webp';image.alt=alt[type];image.loading='lazy';image.decoding='async';
  image.addEventListener('error',function(){bar.textContent=alt[type];},{once:true});
  bar.appendChild(image);return bar;
}
function render(){
  var grid=document.getElementById('simpleGrid');grid.replaceChildren();
  if(!days.length){grid.innerHTML='<div class="empty">Aucune journée trouvée dans les fichiers de l’emploi du temps.</div>';return;}
  var day=days[currentIndex];
  document.getElementById('simpleDate').textContent=day.label;
  document.getElementById('simpleWeek').textContent=day.weekTitle||'';
  var rows=day.rows.filter(function(r){return Array.isArray(r)&&String(r[1]||'').trim();});
  var inserted={};var prior=null;
  function addPause(type){if(!inserted[type]){grid.appendChild(pauseStrip(type));inserted[type]=true;}}
  rows.forEach(function(row){
    var s=String(row[1]||'');var slot=timeRange(row);
    var explicit=pauseTypeFromRow(row);
    if(explicit){addPause(explicit);prior=slot;return;}
    if(prior&&prior.end!==null&&slot.start!==null){
      var gap=slot.start-prior.end;
      if(gap>=5&&gap<=30&&prior.end>=10*60+15&&prior.end<=10*60+55&&slot.start>=11*60&&slot.start<=11*60+25)addPause('recreation-matin');
      if(gap>=45&&prior.end>=11*60+30&&prior.end<=12*60+30&&slot.start>=13*60+45&&slot.start<=14*60+30)addPause('pause-midi-cantine-maison');
      if(gap>=5&&gap<=30&&prior.end>=15*60+40&&prior.end<=16*60+5&&slot.start>=16*60+10&&slot.start<=16*60+35)addPause('recreation-apres-midi');
    }
    var k=kindFor(row),el=document.createElement('article');el.className='simple-row '+k;
    var left=document.createElement('div');left.className='simple-subject';var labels=imagesFor(row,k);
    if(labels.length){var group=document.createElement('div');group.className=labels.length>1?'subject-banner-set':'subject-banner-single';
      labels.forEach(function(label){var photo=document.createElement('img');photo.className='subject-banner';photo.src='images/edt-etiquettes/'+label+'.webp';photo.alt=labelText[label]||subjectName(s,k);photo.loading='lazy';photo.decoding='async';photo.addEventListener('error',function(){photo.replaceWith(document.createTextNode(photo.alt));},{once:true});group.appendChild(photo);});left.appendChild(group);
    }else{var name=document.createElement('span');name.className='subject-plain-label';name.textContent=subjectName(s,k);left.appendChild(name);}
    var right=document.createElement('div');right.className='simple-activity';right.appendChild(learningContent(row));el.appendChild(left);el.appendChild(right);grid.appendChild(el);
    prior=slot;
  });
  document.getElementById('prevDayBtn').disabled=currentIndex<=0;
  document.getElementById('nextDayBtn').disabled=currentIndex>=days.length-1;
}
document.getElementById('prevDayBtn').addEventListener('click',function(){if(currentIndex>0){currentIndex--;render();window.scrollTo({top:0,behavior:'smooth'});}});
document.getElementById('nextDayBtn').addEventListener('click',function(){if(currentIndex<days.length-1){currentIndex++;render();window.scrollTo({top:0,behavior:'smooth'});}});
document.getElementById('todayBtn').addEventListener('click',function(){currentIndex=nearestIndexToToday();render();});
currentIndex=nearestIndexToToday();render();
})();
</script>
</body>
</html>
